<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChemEasyy Education - 2026</title>
    
    <!-- Cần Tailwind CSS cho Layout -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Font chữ hiện đại -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        brand: { bg: '#ecfdf5', dark: '#0f172a', primary: '#10b981', light: '#d1fae5', accent: '#ec4899' }
                    },
                    boxShadow: {
                        'neo': '4px 4px 0px 0px rgba(15, 23, 42, 1)',
                        'neo-sm': '2px 2px 0px 0px rgba(15, 23, 42, 1)',
                    }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #ecfdf5; color: #0f172a; margin: 0; overflow: hidden; }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 2px solid #0f172a; border-radius: 1.5rem;
        }
        
        .neo-btn {
            border: 2px solid #0f172a; font-weight: 700; transition: all 0.15s ease; cursor: pointer; text-transform: uppercase;
        }
        .neo-btn:hover { transform: translate(-2px, -2px); box-shadow: 4px 4px 0px 0px rgba(15, 23, 42, 1); }
        .neo-btn:active { transform: translate(0, 0); box-shadow: 0px 0px 0px 0px rgba(15, 23, 42, 1); }
        
        .neo-input {
            border: 2px solid #0f172a; background: rgba(255, 255, 255, 0.9); transition: all 0.2s; outline: none; font-weight: 600;
        }
        .neo-input:focus { background: #fff; box-shadow: 4px 4px 0px 0px rgba(16, 185, 129, 0.4); border-color: #10b981; }

        .marquee-container { overflow: hidden; white-space: nowrap; background: #d1fae5; border-bottom: 2px solid #0f172a; }
        .marquee-content { display: inline-block; animation: marquee 25s linear infinite; }
        @keyframes marquee { 0% { transform: translateX(100vw); } 100% { transform: translateX(-100%); } }
        
        /* Cấu hình Logo lơ lửng, không nền, bóng mờ */
        .logo-main-floating {
            position: absolute; top: 1.5rem; left: 50%; transform: translateX(-50%); z-index: 50; pointer-events: none;
            height: 140px; border: none !important; outline: none; background: transparent;
            filter: drop-shadow(0px 8px 12px rgba(0, 0, 0, 0.25)); 
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .custom-scrollbar { overflow-y: auto; }

        #modal-container { position: fixed; inset: 0; z-index: 1000; display: none; background: rgba(15,23,42,0.6); backdrop-filter: blur(4px); align-items: center; justify-content: center; padding: 1rem; }
        .modal-content { background: white; border: 2px solid #0f172a; border-radius: 1.5rem; box-shadow: 8px 8px 0px 0px rgba(15,23,42,1); width: 100%; max-width: 700px; max-height: 90vh; display: flex; flex-direction: column; animation: slideUp 0.3s ease-out; }
        #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .toast-item { pointer-events: auto; background: white; border: 2px solid #0f172a; padding: 1rem 1.5rem; border-radius: 0.5rem; box-shadow: 4px 4px 0px 0px rgba(15,23,42,1); font-weight: 700; text-transform: uppercase; font-size: 0.75rem; animation: slideInRight 0.3s ease-out forwards; display: flex; align-items: center; gap: 0.75rem; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Utilities */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="app" class="w-full h-full flex flex-col relative">
        <div class="flex items-center justify-center h-full flex-col gap-4 text-brand-dark">
            <i class="fa-solid fa-circle-notch fa-spin text-4xl text-emerald-500"></i>
            <div class="text-xl font-black uppercase tracking-widest animate-pulse">Đang nạp hệ thống lõi...</div>
        </div>
    </div>
    
    <div id="modal-container"></div>
    <div id="toast-container"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDocs, onSnapshot, query, addDoc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Dùng cấu hình Firebase bạn yêu cầu. Tuy nhiên môi trường sẽ cố ghi đè bằng config nội bộ nếu chạy trên platform.
        let firebaseConfig = {
            apiKey: "AIzaSyCbNC7RSwD_hhacqVYQkYSVX-RCdIwNSnc",
            authDomain: "he-thong-thi-2026-cee.firebaseapp.com",
            projectId: "he-thong-thi-2026-cee",
            storageBucket: "he-thong-thi-2026-cee.firebasestorage.app",
            messagingSenderId: "323776019052",
            appId: "1:323776019052:web:74b07dea05a5f0e7493649",
            measurementId: "G-1V75EG9499"
        };
        
        const BRAND = {
            logoMain: "https://i.postimg.cc/wMs3Wv7Q/8-removebg-preview.png",
            logoSub: "https://i.postimg.cc/BbGtV3D7/9-removebg-preview.png",
            adminEmail: "chemeasyyeducation@gmail.com"
        };

        const EVENT_TYPES = {
            'TEACHING': { label: 'Lịch Dạy', color: 'bg-emerald-200 text-emerald-900 border-emerald-500' },
            'MEETING': { label: 'Họp Nội Bộ', color: 'bg-yellow-200 text-yellow-900 border-yellow-500' },
            'TASK': { label: 'Làm Việc', color: 'bg-blue-200 text-blue-900 border-blue-500' },
            'OTHER': { label: 'Khác', color: 'bg-gray-200 text-gray-900 border-gray-500' }
        };

        // BỘ NHỚ LÕI (STATE MANAGEMENT)
        window.STATE = {
            isOnline: false,
            user: null, 
            view: 'LOGIN', 
            activeTab: 'DASHBOARD',
            
            // Dữ liệu nội bộ
            users: [],
            events: [],
            tasks: [],
            announcements: [{ id: 'a1', title: 'CHÀO MỪNG 2026', content: 'Hệ thống đã chính thức đi vào hoạt động. Vui lòng cập nhật giáo án.', priority: 'INFO', target: 'ALL' }],
            
            // UI States
            showDropdown: false,
            calView: 'WEEK',
            calDate: new Date(),
            dashboardPeriod: 'DAY', // DAY, WEEK, MONTH
            qrConfig: { code: 'CHEM_XYZ', intervalId: null, active: false, startTime: '07:00', endTime: '08:00' },
            
            unsubs: [],
            db: null
        };

        window.showToast = (msg, type = 'SUCCESS') => {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const icon = type === 'ERROR' ? '<i class="fa-solid fa-triangle-exclamation text-pink-500 text-xl"></i>' : 
                         type === 'WARNING' ? '<i class="fa-solid fa-circle-exclamation text-yellow-500 text-xl"></i>' :
                         '<i class="fa-solid fa-circle-check text-emerald-500 text-xl"></i>';
            toast.className = `toast-item`;
            toast.innerHTML = `${icon} <span class="flex-1">${msg}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.style.animation = 'slideInRight 0.3s ease-in reverse forwards'; setTimeout(()=>toast.remove(), 300); }, 4000);
        };

        window.openModal = (title, htmlContent) => {
            const container = document.getElementById('modal-container');
            container.innerHTML = `
                <div class="modal-content relative" id="modal-box">
                    <div class="flex justify-between items-center p-5 border-b-2 border-brand-dark bg-gray-50 rounded-t-[1.3rem] shrink-0">
                        <h3 class="font-black text-lg uppercase tracking-tight">${title}</h3>
                        <button onclick="closeModal()" class="w-8 h-8 flex items-center justify-center neo-btn rounded-lg bg-white hover:bg-pink-100 text-pink-600 transition-colors"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                    <div class="p-6 overflow-y-auto flex-1 custom-scrollbar">
                        ${htmlContent}
                    </div>
                </div>`;
            container.style.display = 'flex';
            container.onclick = (e) => { if(e.target === container) closeModal(); };
        };

        window.closeModal = () => { document.getElementById('modal-container').style.display = 'none'; };

        const formatDate = (d) => { const year = d.getFullYear(); const month = String(d.getMonth() + 1).padStart(2, '0'); const day = String(d.getDate()).padStart(2, '0'); return `${year}-${month}-${day}`; };
        
        // Cập nhật Storage Fallback
        const saveLocal = (key, data) => localStorage.setItem(`chem_${key}`, JSON.stringify(data));
        const loadLocal = (key, defaultVal) => { const val = localStorage.getItem(`chem_${key}`); return val ? JSON.parse(val) : defaultVal; };

        // MOCK DATA khởi tạo nếu LocalStorage rỗng
        const MOCK_ADMIN = { id: 'admin1', username: 'CE22122007', password: 'Huuhuy2212@', role: 'ADMIN', name: 'Nguyễn Hữu Huy', type: 'ADMIN', status: 'ACTIVE' };
        
        const initFirebase = async () => {
            try {
                const app = initializeApp(firebaseConfig);
                STATE.db = getFirestore(app);
                const auth = getAuth(app);
                await signInAnonymously(auth);
                STATE.isOnline = true;
                console.log("Firebase Connected");
                setupRealtime();
            } catch (error) {
                console.error("Firebase Auth Error:", error);
                STATE.isOnline = false;
                showToast("Đang chạy chế độ Offline do lỗi kết nối Database.", "WARNING");
                loadOfflineData();
                renderApp();
            }
        };

        const setupRealtime = () => {
            STATE.unsubs.forEach(u => u()); STATE.unsubs = [];
            const col = (name) => collection(STATE.db, name);
            
            const handleError = (error) => {
                if (error.code === 'permission-denied') {
                    console.warn("Firestore: Permission Denied. Vui lòng mở quyền Security Rules trên Firebase Console thành 'allow read, write: if true;'");
                } else {
                    console.error("Firestore Error:", error);
                }
                if (STATE.isOnline) {
                    STATE.isOnline = false;
                    showToast("Chưa cấp quyền Database. Chuyển sang lưu trữ LocalStorage.", "WARNING");
                    loadOfflineData();
                    renderApp();
                }
            };
            
            STATE.unsubs.push(onSnapshot(query(col('users')), (snap) => {
                const dbUsers = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                // Đảm bảo Admin gốc luôn tồn tại
                const merged = [MOCK_ADMIN];
                dbUsers.forEach(dbU => { if(dbU.username !== MOCK_ADMIN.username) merged.push(dbU); });
                STATE.users = merged;
                saveLocal('users', merged);
                if(STATE.view !== 'LOGIN') renderApp();
            }, handleError));

            STATE.unsubs.push(onSnapshot(query(col('events')), (snap) => { STATE.events = snap.docs.map(d => ({ id: d.id, ...d.data() })); saveLocal('events', STATE.events); if(STATE.activeTab === 'CALENDAR' || STATE.activeTab === 'DASHBOARD') renderApp(); }, handleError));
            STATE.unsubs.push(onSnapshot(query(col('tasks')), (snap) => { STATE.tasks = snap.docs.map(d => ({ id: d.id, ...d.data() })); saveLocal('tasks', STATE.tasks); if(STATE.activeTab === 'TASKS') renderApp(); }, handleError));
            STATE.unsubs.push(onSnapshot(query(col('announcements')), (snap) => { 
                const anns = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                if(anns.length > 0) STATE.announcements = anns; 
                saveLocal('announcements', STATE.announcements);
                if(STATE.view === 'LOGIN' || STATE.activeTab === 'ANNOUNCEMENTS') renderApp(); 
            }, handleError));
        };

        const loadOfflineData = () => {
            STATE.users = loadLocal('users', [MOCK_ADMIN, { id: 'gv1', username: 'gv01', password: '123', role: 'STAFF', name: 'GV Minh Anh', type: 'TEACHER', status: 'ACTIVE', subject: 'Hóa', grade: '12' }]);
            STATE.events = loadLocal('events', []);
            STATE.tasks = loadLocal('tasks', []);
            STATE.announcements = loadLocal('announcements', STATE.announcements);
        };

        window.handleLogin = (e) => {
            e.preventDefault();
            const u = document.getElementById('login_user').value.trim();
            const p = document.getElementById('login_pass').value.trim();
            
            const user = STATE.users.find(x => x.username === u && x.password === p);
            if (user) {
                if(user.status && user.status !== 'ACTIVE') return showToast('Tài khoản đang bị khóa hoặc đã nghỉ việc.', 'ERROR');
                STATE.user = user;
                STATE.view = 'APP';
                STATE.activeTab = 'DASHBOARD';
                showToast(`Đăng nhập thành công: ${user.name}`);
                renderApp();
            } else {
                showToast('Mã nhân sự hoặc mật khẩu không chính xác!', 'ERROR');
            }
        };

        window.handleLogout = () => { STATE.user = null; STATE.view = 'LOGIN'; STATE.showDropdown = false; showToast('Đã đăng xuất'); renderApp(); };
        window.changeTab = (tab) => { STATE.activeTab = tab; STATE.showDropdown = false; renderApp(); };
        window.toggleDropdown = () => { STATE.showDropdown = !STATE.showDropdown; renderApp(); };

        const renderApp = () => {
            const root = document.getElementById('app');
            if (STATE.view === 'LOGIN') root.innerHTML = renderLoginScreen();
            else root.innerHTML = renderWorkspace();
        };

        const renderLoginScreen = () => {
            const ann = STATE.announcements[0] || { title: 'THÔNG BÁO', content: 'Hệ thống đang hoạt động.' };
            
            return `
            <div class="w-full h-full flex flex-col relative bg-emerald-50 selection:bg-emerald-500 selection:text-white">
                
                <!-- Topbar -->
                <div class="h-12 bg-emerald-100 border-b-2 border-brand-dark flex items-center justify-between shrink-0 z-20 overflow-hidden shadow-sm">
                    <div class="marquee-container flex-1 h-full flex items-center px-4 bg-transparent border-none">
                        <span class="marquee-content font-black text-sm uppercase tracking-widest text-emerald-800"><i class="fa-solid fa-bullhorn mr-2"></i> ${ann.title}: ${ann.content}</span>
                    </div>
                    <div class="border-l-2 border-brand-dark h-full flex items-center px-6 bg-brand-dark text-white font-black text-sm tracking-wider shrink-0" id="loginClock">
                        --:--:--
                    </div>
                </div>

                <!-- Logo Lơ Lửng (Đã sửa lỗi dính) -->
                <img src="${BRAND.logoMain}" alt="Main Logo" class="logo-main-floating">

                <!-- Vùng Nội Dung Căn Giữa -->
                <div class="flex-1 w-full flex items-center justify-center p-4 relative z-10 fade-in">
                    <!-- Khung đăng nhập: Thu nhỏ kích thước, viền mỏng hơn -->
                    <div class="w-full max-w-[900px] h-[550px] bg-white border-2 border-brand-dark rounded-[2rem] shadow-neo flex overflow-hidden relative mt-8">
                        
                        <!-- Đường kẻ giữa Neo-brutalism -->
                        <div class="absolute top-0 bottom-0 left-1/2 w-0.5 bg-brand-dark z-10 hidden md:block opacity-30"></div>

                        <!-- Cột Trái: Bảng Tin -->
                        <div class="hidden md:flex w-1/2 p-8 flex-col bg-emerald-50/50 pt-24 relative overflow-y-auto custom-scrollbar">
                            <h2 class="text-3xl font-black uppercase mb-8 text-center tracking-tight text-brand-dark">BẢNG THÔNG TIN</h2>
                            <div class="space-y-4 pr-2">
                                ${STATE.announcements.filter(a=>a.target==='ALL'||a.target==='LOGIN').slice(0,3).map(a => `
                                    <div class="bg-white border-2 border-brand-dark p-5 rounded-2xl shadow-sm hover:shadow-neo-sm transition-all group">
                                        <div class="flex items-center gap-2 mb-3">
                                            <span class="px-2 py-0.5 text-[10px] font-black uppercase border border-brand-dark rounded ${a.priority === 'URGENT' ? 'bg-pink-500 text-white' : 'bg-emerald-400 text-brand-dark'}">${a.priority || 'INFO'}</span>
                                        </div>
                                        <h4 class="text-base font-black uppercase leading-snug mb-2 group-hover:text-emerald-600 transition-colors">${a.title}</h4>
                                        <p class="text-xs font-bold text-gray-600">${a.content}</p>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <!-- Cột Phải: Form Login -->
                        <div class="w-full md:w-1/2 p-8 flex flex-col justify-center items-center bg-white relative pt-20">
                            <!-- Logo phụ: Phóng to, Không viền -->
                            <img src="${BRAND.logoSub}" alt="Sub Logo" class="h-[85px] object-contain mb-8 filter drop-shadow-sm mix-blend-multiply">
                            
                            <h2 class="text-2xl font-black uppercase mb-8 text-center tracking-tight w-full">ĐĂNG NHẬP HỆ THỐNG</h2>
                            
                            <form onsubmit="window.handleLogin(event)" class="w-full max-w-[320px] space-y-5">
                                <div>
                                    <label class="block font-black text-xs mb-2 uppercase text-gray-500 tracking-wider">Mã Tài khoản</label>
                                    <input type="text" id="login_user" class="w-full bg-gray-50 border-2 border-brand-dark rounded-xl px-4 py-3 text-sm font-bold outline-none focus:bg-white focus:shadow-neo-sm transition-all" placeholder="Mã GV / Admin" required>
                                </div>
                                <div>
                                    <label class="block font-black text-xs mb-2 uppercase text-gray-500 tracking-wider">Mật khẩu</label>
                                    <input type="password" id="login_pass" class="w-full bg-gray-50 border-2 border-brand-dark rounded-xl px-4 py-3 text-sm font-bold outline-none focus:bg-white focus:shadow-neo-sm transition-all" placeholder="••••••••" required>
                                </div>
                                <button type="submit" class="w-full mt-6 bg-brand-dark text-white font-black text-sm uppercase py-4 rounded-xl neo-btn shadow-neo">BẮT ĐẦU PHIÊN LÀM VIỆC</button>
                                <div class="text-center mt-6">
                                    <span class="text-[10px] font-black uppercase text-gray-400 hover:text-brand-dark cursor-pointer transition-colors border-b border-transparent hover:border-brand-dark pb-0.5">YÊU CẦU CẤP LẠI MẬT KHẨU</span>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>`;
        };

        // Kích hoạt đồng hồ Login
        setInterval(() => { const c = document.getElementById('loginClock'); if(c) c.innerText = new Date().toLocaleTimeString('vi-VN'); }, 1000);

        const renderWorkspace = () => {
            const isAdmin = STATE.user.role === 'ADMIN';
            
            const MENUS = isAdmin ? [
                { id: 'DASHBOARD', icon: 'fa-chart-pie', text: 'Tổng Quan' },
                { id: 'USERS', icon: 'fa-users', text: 'Nhân Sự' },
                { id: 'CALENDAR', icon: 'fa-calendar-days', text: 'Lịch & Phân Công' },
                { id: 'TASKS', icon: 'fa-list-check', text: 'Công Việc' },
                { id: 'ATTENDANCE', icon: 'fa-qrcode', text: 'Chấm Công & QR' },
                { id: 'DOCS', icon: 'fa-folder-open', text: 'Tài Liệu' },
                { id: 'ANNOUNCEMENTS', icon: 'fa-bullhorn', text: 'Bảng Tin' },
                { id: 'REQUESTS', icon: 'fa-envelope-open-text', text: 'Duyệt Yêu Cầu' }
            ] : [
                { id: 'DASHBOARD', icon: 'fa-house', text: 'Tổng Quan' },
                { id: 'CALENDAR', icon: 'fa-calendar-days', text: 'Lịch Của Tôi' },
                { id: 'TASKS', icon: 'fa-list-check', text: 'Công Việc' },
                { id: 'ATTENDANCE', icon: 'fa-qrcode', text: 'Chấm Công' },
                { id: 'DOCS', icon: 'fa-folder-open', text: 'Tài Liệu' },
                { id: 'REQUESTS', icon: 'fa-paper-plane', text: 'Gửi Yêu Cầu' }
            ];

            return `
            <div class="flex flex-col h-full w-full bg-emerald-50">
                <!-- TOPBAR 3 PHẦN CHUẨN XÁC -->
                <div class="h-16 bg-white border-b-2 border-brand-dark flex items-center justify-between px-6 shrink-0 z-30 shadow-sm">
                    <!-- Trái: Logo -->
                    <div class="flex items-center gap-3 w-1/3">
                        <img src="${BRAND.logoMain}" class="h-10 mix-blend-multiply">
                        <div class="hidden lg:block border-l-2 border-brand-dark pl-3">
                            <h1 class="font-black text-xs uppercase leading-tight tracking-wider text-brand-dark">CHEMEASYY EDUCATION</h1>
                            <p class="text-[9px] font-bold text-gray-500 uppercase tracking-widest">Mở trí - Luyện tài - Dựng nhân</p>
                        </div>
                    </div>
                    
                    <!-- Giữa: Tiêu đề -->
                    <div class="w-1/3 text-center hidden md:block">
                        <span class="font-black text-sm uppercase tracking-widest bg-emerald-100 text-emerald-900 px-4 py-1.5 rounded-lg border-2 border-brand-dark shadow-neo-sm">HỆ THỐNG QUẢN TRỊ 2026</span>
                    </div>

                    <!-- Phải: Tài khoản Dropdown -->
                    <div class="w-1/3 flex justify-end relative">
                        <button onclick="window.toggleDropdown()" class="flex items-center gap-3 hover:bg-gray-50 px-3 py-1.5 rounded-xl transition-colors text-right border-2 border-transparent hover:border-brand-dark">
                            <div class="hidden sm:block">
                                <p class="font-black text-xs uppercase text-brand-dark leading-tight">${STATE.user.name}</p>
                                <p class="text-[9px] font-bold text-gray-500 uppercase tracking-wider">${STATE.user.role === 'ADMIN' ? 'Quản Trị Viên' : 'Giáo Viên'} - ${STATE.user.username}</p>
                            </div>
                            <div class="w-8 h-8 bg-brand-dark text-white rounded-full flex items-center justify-center font-black border-2 border-white ring-2 ring-brand-dark shadow-sm">${STATE.user.name.charAt(0)}</div>
                            <i class="fa-solid fa-chevron-down text-[10px] text-gray-600 transition-transform ${STATE.showDropdown ? 'rotate-180' : ''}"></i>
                        </button>

                        ${STATE.showDropdown ? `
                        <div class="absolute top-[3.5rem] right-0 w-64 bg-white border-2 border-brand-dark rounded-xl shadow-neo z-50 overflow-hidden fade-in">

                            <div><label class="block text-[10px] font-black uppercase mb-1.5">Chứng chỉ</label><input type="text" id="u_cert" value="${u.certs||''}" class="w-full neo-input p-2.5 rounded-lg text-sm"></div>
                            <div class="col-span-2"><label class="block text-[10px] font-black uppercase mb-1.5">Kinh nghiệm</label><textarea id="u_exp" class="w-full neo-input p-2.5 rounded-lg text-sm h-16">${u.exp||''}</textarea></div>
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-brand-dark text-white font-black uppercase py-4 neo-btn rounded-xl mt-4 shadow-neo hover:bg-emerald-500 transition-colors">${id && id !== 'null' ? 'Cập Nhật Hồ Sơ' : 'Lưu Hồ Sơ Mới'}</button>
                </form>
            `;
            openModal(id && id !== 'null' ? 'Chỉnh Sửa Hồ Sơ' : 'Tạo Nhân Sự Mới', html);
        };

        window.saveUser = async (e, id) => {
            e.preventDefault();
            const role = document.getElementById('u_type').value === 'ADMIN' ? 'ADMIN' : 'STAFF';
            const data = {
                username: document.getElementById('u_user').value.trim(), password: document.getElementById('u_pass').value,
                name: document.getElementById('u_name').value.trim(), type: document.getElementById('u_type').value,
                status: document.getElementById('u_status').value, phone: document.getElementById('u_phone').value,
                email: document.getElementById('u_email').value, dob: document.getElementById('u_dob').value,
                address: document.getElementById('u_address').value, subject: document.getElementById('u_sub').value,
                grade: document.getElementById('u_grade').value, program: document.getElementById('u_prog').value,
                certs: document.getElementById('u_cert').value, exp: document.getElementById('u_exp').value, role: role
            };

            try {
                if (id && id !== 'null') {
                    if(STATE.isOnline) await updateDoc(doc(STATE.db, 'users', id), data);
                    else { const idx = STATE.users.findIndex(x=>x.id===id); STATE.users[idx] = {...STATE.users[idx], ...data}; saveLocal('users', STATE.users); }
                    showToast('Đã cập nhật hồ sơ thành công');
                } else {
                    if(STATE.users.find(x => x.username === data.username)) return showToast('Mã nhân sự đã tồn tại', 'ERROR');
                    if(STATE.isOnline) await addDoc(collection(STATE.db, 'users'), {...data, createdAt: serverTimestamp()});
                    else { STATE.users.push({id: 'u'+Date.now(), ...data}); saveLocal('users', STATE.users); }
                    showToast('Đã tạo nhân sự mới');
                }
                closeModal(); if(!STATE.isOnline) renderApp();
            } catch(err) { console.error(err); showToast('Lỗi lưu dữ liệu. Hãy kiểm tra kết nối mạng.', 'ERROR'); }
        };

        window.deleteUser = async (id) => {
            if(id === STATE.user.id) return showToast('Không thể xóa chính bạn', 'ERROR');
            if(id === 'admin1') return showToast('Không thể xóa Admin hệ thống mặc định', 'ERROR');
            if(confirm('Xóa VĨNH VIỄN hồ sơ này? Hệ thống khuyến nghị chuyển Trạng thái thành "Nghỉ việc" thay vì xóa.')) {
                try {
                    if(STATE.isOnline) await deleteDoc(doc(STATE.db, 'users', id));
                    else { STATE.users = STATE.users.filter(x => x.id !== id); saveLocal('users', STATE.users); }
                    showToast('Đã xóa hồ sơ'); if(!STATE.isOnline) renderApp();
                } catch(e) { showToast('Lỗi xóa', 'ERROR'); }
            }
        };

        const renderCalendarModule = (isAdmin) => {
            const mode = STATE.calView;
            const d = STATE.calDate;
            let title = '';
            
            if(mode === 'WEEK') {
                const start = new Date(d); start.setDate(d.getDate() - d.getDay() + 1);
                const end = new Date(start); end.setDate(start.getDate() + 6);
                title = `Tuần ${start.getDate()}/${start.getMonth()+1} - ${end.getDate()}/${end.getMonth()+1}`;
            } else if (mode === 'MONTH') title = `Tháng ${d.getMonth()+1} / ${d.getFullYear()}`;
            else if (mode === 'DAY') title = `Ngày ${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`;
            else title = `Năm ${d.getFullYear()}`;

            return `
            <div class="h-full flex flex-col fade-in max-w-6xl mx-auto relative">
                <!-- Header -->
                <div class="flex justify-between items-end border-b-2 border-brand-dark pb-3 mb-4 shrink-0">
                    <div>
                        <h2 class="text-2xl font-black uppercase tracking-tight text-brand-dark">LỊCH TRÌNH & ĐIỀU PHỐI</h2>
                        <!-- Tabs chuyển đổi View (ĐÃ SỬA LỖI onClick) -->
                        <div class="flex bg-white border-2 border-brand-dark rounded-lg overflow-hidden mt-3 shadow-sm inline-flex">
                            ${['YEAR', 'MONTH', 'WEEK', 'DAY'].map(m => `
                                <button onclick="window.changeCalMode('${m}')" class="px-5 py-2 text-[10px] font-black uppercase transition-colors tracking-widest ${mode===m ? 'bg-brand-dark text-white' : 'hover:bg-emerald-50 border-r-2 border-brand-dark last:border-r-0 text-gray-700'}">${m==='YEAR'?'Năm':m==='MONTH'?'Tháng':m==='WEEK'?'Tuần':'Ngày'}</button>
                            `).join('')}
                        </div>
                    </div>
                    ${isAdmin ? `<button onclick="window.openEventModal()" class="px-5 py-2.5 bg-brand-dark text-white font-black text-xs uppercase neo-btn rounded-xl shadow-neo-sm hover:bg-emerald-500 transition-colors flex items-center gap-2"><i class="fa-solid fa-calendar-plus"></i> TẠO SỰ KIỆN</button>` : ''}
                </div>

                <!-- Calendar Grid -->
                <div class="flex-1 bg-white border-2 border-brand-dark rounded-2xl shadow-neo-sm flex flex-col overflow-hidden">
                    <!-- Điều hướng thời gian -->
                    <div class="flex items-center justify-between p-4 border-b-2 border-brand-dark bg-gray-50 shrink-0">
                        <div class="flex gap-1.5">
                            <button onclick="window.navCal(-1)" class="w-10 h-10 flex items-center justify-center neo-btn bg-white rounded-lg text-sm shadow-sm hover:bg-gray-100"><i class="fa-solid fa-chevron-left"></i></button>
                            <button onclick="window.navCal(1)" class="w-10 h-10 flex items-center justify-center neo-btn bg-white rounded-lg text-sm shadow-sm hover:bg-gray-100"><i class="fa-solid fa-chevron-right"></i></button>
                            <button onclick="window.navCal(0)" class="px-4 h-10 flex items-center justify-center neo-btn bg-brand-dark text-white rounded-lg text-[10px] font-black uppercase ml-2 shadow-sm hover:bg-emerald-500">Hôm nay</button>
                        </div>
                        <h3 class="font-black text-base uppercase tracking-widest text-brand-dark">${title}</h3>
                        
                        <!-- Bộ lọc (UI placeholder) -->
                        <div class="hidden md:flex gap-2">
                            <span class="px-2 py-1 bg-emerald-200 border-2 border-emerald-500 text-emerald-900 rounded text-[9px] font-black uppercase">Lịch Dạy</span>
                            <span class="px-2 py-1 bg-yellow-200 border-2 border-yellow-500 text-yellow-900 rounded text-[9px] font-black uppercase">Họp</span>
                        </div>
                    </div>
                    
                    <div class="flex-1 overflow-y-auto bg-gray-50/50 custom-scrollbar relative">
                        ${renderCalGrid(mode, isAdmin)}
                    </div>
                </div>
            </div>`;
        };

        const renderCalGrid = (mode, isAdmin) => {
            const d = STATE.calDate;
            const evs = STATE.events.filter(e => isAdmin || e.assignee === STATE.user.id || e.assignee === 'ALL');

            if (mode === 'WEEK') {
                const start = new Date(d); start.setDate(d.getDate() - d.getDay() + 1);
                let days = '', grid = '';
                const dayNames = ['T2','T3','T4','T5','T6','T7','CN'];
                
                for(let i=0; i<7; i++) {
                    const cur = new Date(start); cur.setDate(start.getDate() + i);
                    const dStr = formatDate(cur);
                    const isToday = dStr === formatDate(new Date());
                    
                    days += `<div class="py-3 border-r-2 border-brand-dark last:border-r-0 ${isToday?'bg-emerald-200 text-brand-dark':''}">${dayNames[i]} <span class="text-sm block mt-0.5">${cur.getDate()}</span></div>`;
                    
                    const dayEvs = evs.filter(e => e.date === dStr).sort((a,b)=>a.time.localeCompare(b.time));
                    const evHtml = dayEvs.map(e => {
                        const style = EVENT_TYPES[e.type] || EVENT_TYPES.OTHER;
                        return `<div onclick="event.stopPropagation(); window.openEventModal('${e.id}')" class="m-1.5 p-2.5 border-2 rounded-xl cursor-pointer hover:-translate-y-1 transition-transform shadow-sm ${style.color} group relative">
                            <div class="text-[9px] font-black bg-white/70 inline-block px-1.5 py-0.5 rounded mb-1.5 border border-black/10">${e.time} - ${e.endTime||''}</div>
                            <div class="text-xs font-black leading-tight uppercase tracking-tight">${e.title}</div>
                            <div class="text-[9px] font-bold mt-2 opacity-80 uppercase truncate border-t border-black/10 pt-1"><i class="fa-solid fa-user-check mr-1"></i> ${e.assignee==='ALL'?'Tất cả':(STATE.users.find(u=>u.id===e.assignee)?.name||e.assignee)}</div>
                            ${isAdmin ? `<button onclick="event.stopPropagation(); window.deleteEvent('${e.id}')" class="absolute -top-2 -right-2 w-6 h-6 bg-pink-500 text-white rounded-full border-2 border-brand-dark hidden group-hover:flex items-center justify-center text-[10px]"><i class="fa-solid fa-xmark"></i></button>`:''}
                        </div>`;
                    }).join('');

                    // Thêm sự kiện click vào cột để tạo event cho ngày đó
                    grid += `<div class="border-r-2 border-brand-dark last:border-r-0 min-h-[400px] p-1 bg-white cursor-pointer hover:bg-emerald-50/30 group transition-colors relative" onclick="if(event.target===this) window.openEventModal('', '${dStr}')">
                        <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-10 text-4xl"><i class="fa-solid fa-plus"></i></div>
                        ${evHtml}
                    </div>`;
                }
                return `<div class="grid grid-cols-7 text-center text-[10px] font-black uppercase border-b-2 border-brand-dark bg-gray-100 sticky top-0 z-10 shadow-sm">${days}</div><div class="grid grid-cols-7">${grid}</div>`;
            }
            
            if (mode === 'DAY') {
                const dStr = formatDate(d);
                const dayEvs = evs.filter(e => e.date === dStr).sort((a,b)=>a.time.localeCompare(b.time));
                if(dayEvs.length === 0) return `<div class="p-16 text-center font-black text-gray-400 uppercase text-lg cursor-pointer hover:text-emerald-500 border-4 border-dashed border-gray-200 m-8 rounded-3xl" onclick="window.openEventModal('', '${dStr}')"><i class="fa-regular fa-calendar-xmark text-4xl mb-3 block"></i> Trống lịch. Bấm vào đây để thêm công việc/lịch dạy.</div>`;
                
                return `<div class="p-6 max-w-4xl mx-auto space-y-4">
                    ${dayEvs.map(e => {
                        const style = EVENT_TYPES[e.type] || EVENT_TYPES.OTHER;
                        return `<div class="flex flex-col md:flex-row gap-4 p-5 border-2 border-brand-dark rounded-2xl shadow-neo-sm bg-white hover:-translate-y-1 transition-transform group cursor-pointer" onclick="window.openEventModal('${e.id}')">
                            <div class="font-black text-2xl w-32 shrink-0 border-b-2 md:border-b-0 md:border-r-2 border-gray-200 md:pr-4 text-left md:text-right text-brand-dark flex flex-col justify-center">
                                ${e.time}
                                <span class="text-xs text-gray-400 block mt-1">${e.endTime}</span>
                            </div>
                            <div class="flex-1">
                                <span class="px-2.5 py-1 text-[9px] font-black uppercase border-2 border-brand-dark rounded shadow-sm inline-block mb-2 ${style.color}">${style.label}</span>
                                <h4 class="font-black uppercase text-xl mb-1">${e.title}</h4>
                                <p class="text-xs font-bold text-gray-500 uppercase mt-2 bg-gray-50 inline-block px-2 py-1 rounded border border-gray-200"><i class="fa-solid fa-user-tag mr-1 text-brand-dark"></i> Phụ trách: ${e.assignee==='ALL'?'Tất cả Nhân sự':(STATE.users.find(u=>u.id===e.assignee)?.name||e.assignee)}</p>
                            </div>
                            ${isAdmin ? `<div class="flex gap-2 md:flex-col md:justify-center shrink-0 border-t-2 md:border-t-0 md:border-l-2 border-gray-100 pt-3 md:pt-0 md:pl-4 opacity-0 group-hover:opacity-100 transition-opacity">
                                <button onclick="event.stopPropagation(); window.deleteEvent('${e.id}')" class="w-10 h-10 neo-btn rounded-xl bg-pink-500 text-white text-sm"><i class="fa-solid fa-trash"></i></button>
                            </div>` : ''}
                        </div>`;
                    }).join('')}
                </div>`;
            }
            
            return `<div class="p-16 text-center font-black text-gray-400 uppercase text-lg">Chế độ Tháng/Năm đang thiết kế giao diện chi tiết.<br><span class="text-xs mt-2 block">Vui lòng dùng chế độ Tuần hoặc Ngày để xem và điều phối.</span></div>`;
        };

        window.changeCalMode = (mode) => { STATE.calView = mode; renderApp(); };
        window.navCal = (offset) => {
            if(offset === 0) STATE.calDate = new Date();
            else {
                const d = new Date(STATE.calDate);
                if(STATE.calView === 'WEEK') d.setDate(d.getDate() + (offset * 7));
                else if(STATE.calView === 'MONTH') d.setMonth(d.getMonth() + offset);
                else if(STATE.calView === 'YEAR') d.setFullYear(d.getFullYear() + offset);
                else d.setDate(d.getDate() + offset);
                STATE.calDate = d;
            }
            renderApp();
        };

        window.openEventModal = (id = '', defaultDate = '') => {
            const isAdmin = STATE.user.role === 'ADMIN';
            if(!isAdmin && !id) return showToast('Chỉ Admin mới có quyền tạo lịch hệ thống', 'ERROR');
            
            const e = id ? STATE.events.find(x=>x.id===id) : {};
            const d = defaultDate || formatDate(new Date());

            const html = `
                <form onsubmit="window.saveEvent(event, '${id}')" class="space-y-5">
                    <div class="bg-gray-50 p-5 border-2 border-brand-dark rounded-xl">
                        <div><label class="block text-[10px] font-black uppercase mb-1.5 text-brand-dark">Tiêu đề lịch / Sự kiện</label><input type="text" id="ev_title" value="${e.title||''}" class="w-full neo-input p-3 rounded-lg text-sm" placeholder="VD: Dạy Hóa 12A, Họp chuyên môn..." required ${!isAdmin?'readonly':''}></div>
                        
                        <div class="grid grid-cols-2 gap-4 mt-4">
                            <div><label class="block text-[10px] font-black uppercase mb-1.5">Ngày thực hiện</label><input type="date" id="ev_date" value="${e.date||d}" class="w-full neo-input p-3 rounded-lg text-sm bg-white" required ${!isAdmin?'readonly':''}></div>
                            <div><label class="block text-[10px] font-black uppercase mb-1.5">Phân loại</label>
                                <select id="ev_type" class="w-full neo-input p-3 rounded-lg bg-white text-sm" ${!isAdmin?'disabled':''}>
                                    ${Object.entries(EVENT_TYPES).map(([k,v]) => `<option value="${k}" ${e.type===k?'selected':''}>${v.label}</option>`).join('')}
                                </select>
                            </div>
                            <div><label class="block text-[10px] font-black uppercase mb-1.5">Giờ Bắt đầu</label><input type="time" id="ev_time" value="${e.time||'08:00'}" class="w-full neo-input p-3 rounded-lg text-sm bg-white" required ${!isAdmin?'readonly':''}></div>
                            <div><label class="block text-[10px] font-black uppercase mb-1.5">Giờ Kết thúc</label><input type="time" id="ev_endtime" value="${e.endTime||'10:00'}" class="w-full neo-input p-3 rounded-lg text-sm bg-white" required ${!isAdmin?'readonly':''}></div>
                        </div>
                    </div>
                    
                    <div class="bg-emerald-50 p-5 border-2 border-brand-dark rounded-xl">
                        <label class="block text-[10px] font-black uppercase mb-1.5 text-emerald-800">Phân công Giáo viên / Trợ giảng</label>
                        <select id="ev_assign" class="w-full neo-input p-3 rounded-lg bg-white text-sm" ${!isAdmin?'disabled':''}>
                            <option value="ALL">--- Tất cả nhân sự ---</option>
                            <optgroup label="Giáo Viên">
                                ${STATE.users.filter(u=>u.type==='TEACHER').map(u=>`<option value="${u.id}" ${e.assignee===u.id?'selected':''}>${u.name} (${u.subject||'N/A'})</option>`).join('')}
                            </optgroup>
                            <optgroup label="Trợ Giảng">
                                ${STATE.users.filter(u=>u.type==='ASSISTANT').map(u=>`<option value="${u.id}" ${e.assignee===u.id?'selected':''}>${u.name}</option>`).join('')}
                            </optgroup>
                        </select>
                    </div>

                    ${isAdmin ? `<button type="submit" class="w-full bg-brand-dark text-white font-black uppercase py-4 neo-btn rounded-xl mt-2 text-sm shadow-neo hover:bg-emerald-500 transition-colors"><i class="fa-solid fa-floppy-disk mr-2"></i> ${id?'Cập Nhật Sự Kiện':'Lưu Sự Kiện Mới'}</button>` : ''}
                </form>
            `;
            openModal(id ? (isAdmin?'Sửa Lịch Phân Công':'Chi tiết Sự kiện') : 'Tạo Sự Kiện Mới', html);
        };

        window.saveEvent = async (e, id) => {
            e.preventDefault();
            const data = {
                title: document.getElementById('ev_title').value.trim(), date: document.getElementById('ev_date').value,
                time: document.getElementById('ev_time').value, endTime: document.getElementById('ev_endtime').value,
                type: document.getElementById('ev_type').value, assignee: document.getElementById('ev_assign').value
            };
            try {
                if (id) {
                    if(STATE.isOnline) await updateDoc(doc(STATE.db, 'events', id), data);
                    else { const idx = STATE.events.findIndex(x=>x.id===id); STATE.events[idx] = {...STATE.events[idx], ...data}; saveLocal('events', STATE.events); }
                    showToast('Đã cập nhật lịch thành công');
                } else {
                    if(STATE.isOnline) await addDoc(collection(STATE.db, 'events'), {...data, createdAt: serverTimestamp()});
                    else { STATE.events.push({id: 'e'+Date.now(), ...data}); saveLocal('events', STATE.events); }
                    showToast('Tạo lịch thành công');
                }
                closeModal(); if(!STATE.isOnline) renderApp();
            } catch(err) { showToast('Lỗi hệ thống', 'ERROR'); }
        };
        
        window.deleteEvent = async (id) => {
            if(confirm('Bạn có chắc chắn muốn XÓA sự kiện này? Hành động không thể hoàn tác.')) {
                try {
                    if(STATE.isOnline) await deleteDoc(doc(STATE.db, 'events', id));
                    else { STATE.events = STATE.events.filter(x => x.id !== id); saveLocal('events', STATE.events); }
                    showToast('Đã xóa sự kiện'); closeModal(); if(!STATE.isOnline) renderApp();
                } catch(e) { showToast('Lỗi xóa', 'ERROR'); }
            }
        };

        const renderTasksModule = (isAdmin) => {
            const myTasks = isAdmin ? STATE.tasks : STATE.tasks.filter(t => t.assignee === STATE.user.id);
            const todo = myTasks.filter(t => t.status === 'TODO');
            const inProgress = myTasks.filter(t => t.status === 'IN_PROGRESS');
            const completed = myTasks.filter(t => t.status === 'DONE');
            const completionRate = myTasks.length ? Math.round((completed.length / myTasks.length) * 100) : 0;

            const renderCard = (t) => `
                <div class="bg-white border-2 border-brand-dark p-4 rounded-xl shadow-neo-sm mb-4 flex flex-col group cursor-pointer hover:-translate-y-1 transition-transform relative">
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-[9px] font-black uppercase px-2 py-0.5 rounded border border-brand-dark bg-yellow-200 text-yellow-900 shadow-sm"><i class="fa-regular fa-clock"></i> Hạn: ${t.deadline}</span>
                        ${isAdmin ? `<button onclick="window.deleteTask('${t.id}')" class="w-6 h-6 flex items-center justify-center bg-pink-500 text-white rounded border border-brand-dark opacity-0 group-hover:opacity-100 transition-opacity absolute top-3 right-3 text-[10px]"><i class="fa-solid fa-trash"></i></button>`:''}
                    </div>
                    <h4 class="font-black text-sm uppercase leading-tight mb-2 pr-6">${t.title}</h4>
                    <div class="text-xs font-medium text-gray-600 mb-4 bg-gray-50 p-2 rounded border border-gray-100 max-h-20 overflow-y-auto" title="${t.description}">${t.description}</div>
                    
                    ${isAdmin && t.assignee !== 'ALL' ? `<p class="text-[9px] font-black text-emerald-700 uppercase bg-emerald-50 p-1.5 rounded border border-emerald-200 mb-3"><i class="fa-solid fa-user-tag"></i> NV: ${STATE.users.find(u=>u.id===t.assignee)?.name||t.assignee}</p>` : ''}

                    <div class="flex gap-2 shrink-0 border-t-2 border-gray-100 pt-3 mt-auto">
                        ${t.status !== 'TODO' ? `<button onclick="window.updateTask('${t.id}', 'TODO')" class="flex-1 text-[9px] font-black uppercase py-2 border-2 border-brand-dark rounded-lg bg-white hover:bg-gray-100 shadow-sm transition-colors">Cần làm</button>` : ''}
                        ${t.status !== 'IN_PROGRESS' ? `<button onclick="window.updateTask('${t.id}', 'IN_PROGRESS')" class="flex-1 text-[9px] font-black uppercase py-2 border-2 border-brand-dark rounded-lg bg-emerald-300 text-emerald-900 hover:bg-emerald-400 shadow-sm transition-colors">Đang làm</button>` : ''}
                        ${t.status !== 'DONE' ? `<button onclick="window.updateTask('${t.id}', 'DONE')" class="flex-1 text-[9px] font-black uppercase py-2 border-2 border-brand-dark rounded-lg bg-brand-dark text-white hover:bg-gray-800 shadow-sm transition-colors"><i class="fa-solid fa-check"></i> Xong</button>` : ''}
                    </div>
                </div>
            `;

            return `
            <div class="h-full flex flex-col fade-in max-w-6xl mx-auto relative">
                <!-- Header Kanban -->
                <div class="flex justify-between items-end border-b-2 border-brand-dark pb-3 mb-5 shrink-0">
                    <div>
                        <h2 class="text-2xl font-black uppercase tracking-tight text-brand-dark">ĐIỀU PHỐI CÔNG VIỆC</h2>
                        <p class="text-[10px] font-bold text-gray-500 uppercase mt-1">Giao việc và theo dõi tiến độ</p>
                    </div>
                    <div class="flex gap-3">
                        <button onclick="window.showToast('Mục lưu trữ đang được mở... Tiến độ hiện tại: ${completionRate}%', 'INFO')" class="px-5 py-2.5 bg-gray-100 border-2 border-brand-dark rounded-xl text-[10px] font-black uppercase shadow-neo-sm hover:bg-gray-200 transition-colors flex items-center gap-2 group">
