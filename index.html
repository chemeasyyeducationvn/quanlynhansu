<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChemEasyy Education - Quản Trị 2026</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        brand: { bg: '#ecfdf5', dark: '#0f172a', primary: '#10b981', light: '#d1fae5', accent: '#ec4899', yellow: '#fde047' }
                    },
                    boxShadow: {
                        'neo': '4px 4px 0px 0px rgba(15, 23, 42, 1)',
                        'neo-sm': '2px 2px 0px 0px rgba(15, 23, 42, 1)',
                    }
                }
            }
        }
    </script>

    <style>
        /* Security & Base Styles */
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #ecfdf5; color: #0f172a; margin: 0; overflow: hidden; user-select: none; -webkit-user-select: none; }
        
        /* Neo-brutalism Utilities */
        .glass-panel { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 2px solid #0f172a; border-radius: 1.5rem; }
        .neo-btn { border: 2px solid #0f172a; font-weight: 800; transition: all 0.1s ease; cursor: pointer; text-transform: uppercase; }
        .neo-btn:hover { transform: translate(-2px, -2px); box-shadow: 4px 4px 0px 0px rgba(15, 23, 42, 1); }
        .neo-btn:active { transform: translate(0, 0); box-shadow: 0px 0px 0px 0px rgba(15, 23, 42, 1); }
        .neo-input { border: 2px solid #0f172a; background: #fff; transition: all 0.2s; outline: none; font-weight: 600; }
        .neo-input:focus { box-shadow: 4px 4px 0px 0px rgba(16, 185, 129, 0.5); border-color: #10b981; }

        /* Marquee */
        .marquee-container { overflow: hidden; white-space: nowrap; background: #d1fae5; border-bottom: 2px solid #0f172a; }
        .marquee-content { display: inline-block; animation: marquee 25s linear infinite; }
        @keyframes marquee { 0% { transform: translateX(100vw); } 100% { transform: translateX(-100%); } }

        /* Scrollbars */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #0f172a; border-radius: 10px; }
        .custom-scrollbar { overflow-y: auto; overflow-x: auto; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; overflow-x: auto; overflow-y: hidden; }

        /* Modals & Toasts */
        #modal-container { position: fixed; inset: 0; z-index: 1000; display: none; background: rgba(15,23,42,0.7); backdrop-filter: blur(4px); align-items: center; justify-content: center; padding: 1rem; }
        .modal-content { background: white; border: 2px solid #0f172a; border-radius: 1.5rem; box-shadow: 8px 8px 0px 0px rgba(15,23,42,1); width: 100%; max-width: 800px; max-height: 90vh; display: flex; flex-direction: column; animation: slideUp 0.3s ease-out; }
        #toast-container { position: fixed; bottom: 20px; left: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .toast-item { pointer-events: auto; background: white; border: 2px solid #0f172a; padding: 1rem 1.5rem; border-radius: 0.75rem; box-shadow: 4px 4px 0px 0px rgba(15,23,42,1); font-weight: 800; text-transform: uppercase; font-size: 0.75rem; animation: slideInLeft 0.3s ease-out forwards; display: flex; align-items: center; gap: 0.75rem; max-width: 90vw; }
        
        /* Animations */
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideInLeft { from { transform: translateX(-100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        input:disabled, select:disabled, textarea:disabled { background-color: #f1f5f9; cursor: not-allowed; opacity: 0.7; }
    </style>
</head>
<body>
    <!-- Root Container -->
    <div id="app" class="w-screen h-screen flex flex-col relative overflow-hidden bg-brand-bg"></div>
    
    <!-- Global Overlays -->
    <div id="modal-container"></div>
    <div id="toast-container"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, getDocs, onSnapshot, query, addDoc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Security: Block F5, Ctrl+R, Context Menu
        document.addEventListener('keydown', function(e) { if (e.key === 'F5' || (e.ctrlKey && e.key === 'r')) { e.preventDefault(); showToast("Tải lại trang bị khóa. Hệ thống đang lưu phiên bản.", "WARNING"); } });
        document.addEventListener('contextmenu', event => event.preventDefault());

        const appId = 'he-thong-thi-2026-cee';
        const firebaseConfig = {
            apiKey: "AIzaSyCbNC7RSwD_hhacqVYQkYSVX-RCdIwNSnc",
            authDomain: "he-thong-thi-2026-cee.firebaseapp.com",
            projectId: "he-thong-thi-2026-cee",
            storageBucket: "he-thong-thi-2026-cee.firebasestorage.app",
            messagingSenderId: "323776019052",
            appId: "1:323776019052:web:74b07dea05a5f0e7493649",
            measurementId: "G-1V75EG9499"
        };
        
        const BRAND = {
            logoMain: "https://i.postimg.cc/wMs3Wv7Q/8-removebg-preview.png",
            logoSub: "https://i.postimg.cc/BbGtV3D7/9-removebg-preview.png",
            adminEmail: "chemeasyyeducation@gmail.com"
        };

        const EVENT_TYPES = { 'TEACHING': 'Lịch Dạy', 'MEETING': 'Lịch Họp', 'TASK': 'Làm Việc', 'OTHER': 'Khác' };

        // Global State
        window.STATE = {
            isOnline: true,
            user: null, 
            view: 'LOGIN', 
            activeTab: 'DASHBOARD',
            users: [],
            events: [],
            tasks: [],
            loginAnnouncements: [],
            marqueeAnnouncements: [],
            documents: [],
            requests: [],
            attendanceRecords: [], 
            showDropdown: false,
            calView: 'WEEK',
            calDate: new Date(),
            dashboardPeriod: 'DAY',
            unsubs: [],
            db: null,
            auth: null,
            qrSession: null,
            qrInterval: null
        };

        // UI Helpers
        window.showToast = (msg, type = 'SUCCESS') => {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const icon = type === 'ERROR' ? '<i class="fa-solid fa-triangle-exclamation text-brand-accent text-xl shrink-0"></i>' : 
                         type === 'WARNING' ? '<i class="fa-solid fa-circle-exclamation text-brand-yellow text-xl shrink-0"></i>' :
                         '<i class="fa-solid fa-circle-check text-brand-primary text-xl shrink-0"></i>';
            toast.className = `toast-item`;
            toast.innerHTML = `${icon} <span class="flex-1 break-words">${msg}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.style.animation = 'slideInLeft 0.3s ease-in reverse forwards'; setTimeout(()=>toast.remove(), 300); }, 4000);
        };

        window.openModal = (title, htmlContent) => {
            const container = document.getElementById('modal-container');
            container.innerHTML = `
                <div class="modal-content relative flex flex-col h-full max-h-[90vh]">
                    <div class="flex justify-between items-center p-4 md:p-5 border-b-2 border-brand-dark bg-gray-50 rounded-t-[1.3rem] shrink-0">
                        <h3 class="font-black text-base md:text-lg uppercase tracking-tight">${title}</h3>
                        <button onclick="closeModal()" class="w-8 h-8 flex items-center justify-center neo-btn rounded-lg bg-white text-brand-dark hover:bg-brand-accent hover:text-white hover:border-brand-accent"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                    <div class="p-4 md:p-6 overflow-y-auto flex-1 custom-scrollbar bg-white rounded-b-[1.3rem]">
                        ${htmlContent}
                    </div>
                </div>`;
            container.style.display = 'flex';
        };
        window.closeModal = () => { document.getElementById('modal-container').style.display = 'none'; };

        const formatDate = (d) => { const year = d.getFullYear(); const month = String(d.getMonth() + 1).padStart(2, '0'); const day = String(d.getDate()).padStart(2, '0'); return `${year}-${month}-${day}`; };
        const getFormatDisplay = (dStr) => { if(!dStr) return ''; const p = dStr.split('-'); return `${p[2]}/${p[1]}/${p[0]}`; };

        // MOCK ADMIN (Fallback)
        const MOCK_ADMIN = { id: 'admin1', username: 'CE22122007', password: 'Huuhuy2212@', role: 'ADMIN', name: 'Nguyễn Hữu Huy', type: 'ADMIN', status: 'Đang làm', phone: '0900000000', email: 'admin@chemeasyy.edu.vn' };

        const initFirebase = async () => {
            try {
                const app = initializeApp(firebaseConfig);
                STATE.db = getFirestore(app);
                STATE.auth = getAuth(app);
                
                await setPersistence(STATE.auth, browserLocalPersistence);
                await signInAnonymously(STATE.auth);
                
                onAuthStateChanged(STATE.auth, async (user) => {
                    if (user) {
                        setupRealtime(user.uid);
                        const savedUser = JSON.parse(localStorage.getItem('chem_currentUser'));
                        if(savedUser) { STATE.user = savedUser; STATE.view = 'APP'; }
                        renderApp();
                    }
                });
            } catch (error) {
                console.warn("Firebase Init Error:", error);
                STATE.isOnline = false; loadOfflineData(); renderApp();
            }
        };

        const setupRealtime = (uid) => {
            STATE.unsubs.forEach(u => u()); STATE.unsubs = [];
            const publicCol = (name) => collection(STATE.db, 'artifacts', appId, 'public', 'data', name);
            
            const handleErr = (e) => { 
                console.warn("Firestore Read Error (Permission Denied). Switching to Offline mode."); 
                if(STATE.isOnline) { 
                    STATE.isOnline = false; 
                    showToast("Chuyển sang chế độ Offline (Cơ sở dữ liệu đang khóa quyền).", "WARNING"); 
                    loadOfflineData(); 
                    renderApp(); 
                } 
            };
            
            try {
                STATE.unsubs.push(onSnapshot(query(publicCol('users')), (snap) => {
                    const dbUsers = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    STATE.users = [MOCK_ADMIN, ...dbUsers.filter(u => u.username !== MOCK_ADMIN.username)];
                    localStorage.setItem('chem_users', JSON.stringify(STATE.users));
                    if(STATE.activeTab === 'USERS' || STATE.activeTab === 'DASHBOARD') renderApp();
                }, handleErr));

                STATE.unsubs.push(onSnapshot(query(publicCol('events')), (snap) => { 
                    STATE.events = snap.docs.map(d => ({ id: d.id, ...d.data() })); localStorage.setItem('chem_events', JSON.stringify(STATE.events));
                    if(STATE.activeTab === 'CALENDAR' || STATE.activeTab === 'DASHBOARD') renderApp(); 
                }, handleErr));

                STATE.unsubs.push(onSnapshot(query(publicCol('tasks')), (snap) => { 
                    STATE.tasks = snap.docs.map(d => ({ id: d.id, ...d.data() })); localStorage.setItem('chem_tasks', JSON.stringify(STATE.tasks));
                    if(STATE.activeTab === 'TASKS') renderApp(); 
                }, handleErr));

                STATE.unsubs.push(onSnapshot(query(publicCol('announcements')), (snap) => { 
                    const all = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    STATE.loginAnnouncements = all.filter(a => a.type === 'LOGIN');
                    STATE.marqueeAnnouncements = all.filter(a => a.type === 'MARQUEE');
                    localStorage.setItem('chem_anns', JSON.stringify(all));
                    renderApp(); 
                }, handleErr));

                STATE.unsubs.push(onSnapshot(query(publicCol('requests')), (snap) => { 
                    STATE.requests = snap.docs.map(d => ({ id: d.id, ...d.data() })); localStorage.setItem('chem_reqs', JSON.stringify(STATE.requests));
                    if(STATE.activeTab === 'REQUESTS') renderApp(); 
                }, handleErr));
                
                STATE.unsubs.push(onSnapshot(query(publicCol('documents')), (snap) => { 
                    STATE.documents = snap.docs.map(d => ({ id: d.id, ...d.data() })); localStorage.setItem('chem_docs', JSON.stringify(STATE.documents));
                    if(STATE.activeTab === 'DOCS') renderApp(); 
                }, handleErr));

                STATE.unsubs.push(onSnapshot(query(publicCol('attendance')), (snap) => { 
                    STATE.attendanceRecords = snap.docs.map(d => ({ id: d.id, ...d.data() })); localStorage.setItem('chem_att', JSON.stringify(STATE.attendanceRecords));
                    if(STATE.activeTab === 'ATTENDANCE') renderApp(); 
                }, handleErr));

            } catch(e) { handleErr(e); }
        };

        const loadOfflineData = () => {
            STATE.users = JSON.parse(localStorage.getItem('chem_users')) || [MOCK_ADMIN];
            STATE.events = JSON.parse(localStorage.getItem('chem_events')) || [];
            STATE.tasks = JSON.parse(localStorage.getItem('chem_tasks')) || [];
            const anns = JSON.parse(localStorage.getItem('chem_anns')) || [];
            STATE.loginAnnouncements = anns.filter(a => a.type === 'LOGIN');
            STATE.marqueeAnnouncements = anns.filter(a => a.type === 'MARQUEE');
            STATE.requests = JSON.parse(localStorage.getItem('chem_reqs')) || [];
            STATE.documents = JSON.parse(localStorage.getItem('chem_docs')) || [];
            STATE.attendanceRecords = JSON.parse(localStorage.getItem('chem_att')) || [];
        };

        window.handleLogin = (e) => {
            e.preventDefault();
            const u = document.getElementById('login_user').value.trim();
            const p = document.getElementById('login_pass').value.trim();
            const user = STATE.users.find(x => x.username === u && x.password === p);
            if (user) {
                if(user.status && (user.status === 'Tạm nghỉ' || user.status === 'Nghỉ việc')) return showToast('Tài khoản bị khóa.', 'ERROR');
                STATE.user = user; STATE.view = 'APP'; STATE.activeTab = 'DASHBOARD';
                localStorage.setItem('chem_currentUser', JSON.stringify(user));
                showToast(`Xin chào, ${user.name}`); renderApp();
            } else { showToast('Mã nhân sự hoặc mật khẩu sai!', 'ERROR'); }
        };

        window.handleLogout = () => { STATE.user = null; STATE.view = 'LOGIN'; STATE.showDropdown = false; localStorage.removeItem('chem_currentUser'); showToast('Đã đăng xuất'); renderApp(); };
        window.changeTab = (tab) => { STATE.activeTab = tab; STATE.showDropdown = false; renderApp(); };
        window.toggleDropdown = () => { STATE.showDropdown = !STATE.showDropdown; renderApp(); };

        const renderApp = () => {
            const root = document.getElementById('app');
            if (STATE.view === 'LOGIN') { root.innerHTML = renderLoginScreen(); startClock(); } 
            else { stopClock(); root.innerHTML = renderWorkspace(); }
        };

        let clockInterval;
        const startClock = () => {
            if(clockInterval) clearInterval(clockInterval);
            const tick = () => {
                const el = document.getElementById('verticalClock');
                if(el) { 
                    const d = new Date();
                    const days = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
                    const dateStr = `${days[d.getDay()]}, ${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
                    const timeStr = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:<span class="text-brand-primary">${String(d.getSeconds()).padStart(2,'0')}</span>`;
                    el.innerHTML = `<i class="fa-regular fa-calendar mr-1.5"></i> ${dateStr} <span class="mx-2 text-gray-300">|</span> <i class="fa-regular fa-clock mr-1.5"></i> ${timeStr}`;
                }
            };
            tick(); clockInterval = setInterval(tick, 1000);
        };
        const stopClock = () => clearInterval(clockInterval);

        window.viewLoginAnnouncement = (id) => {
            const ann = STATE.loginAnnouncements.find(a => a.id === id);
            if(ann) openModal(ann.title, `<div class="font-medium text-gray-700 whitespace-pre-wrap leading-relaxed text-sm">${ann.content}</div>`);
        };

        const renderLoginScreen = () => {
            const marquees = STATE.marqueeAnnouncements.length > 0 ? STATE.marqueeAnnouncements.map(a => a.title).join(' • ') : "HỆ THỐNG QUẢN TRỊ 2026 - CHEMEASYY EDUCATION";
            
            return `
            <div class="w-full h-full flex flex-col relative bg-emerald-50">
                <!-- Topbar -->
                <div class="h-10 md:h-12 bg-white border-b-2 border-brand-dark flex items-center shrink-0 z-20 shadow-sm">
                    <div class="marquee-container flex-1 h-full flex items-center px-4 border-none">
                        <span class="marquee-content font-black text-xs md:text-sm uppercase tracking-widest text-brand-primary"><i class="fa-solid fa-bullhorn mr-2"></i> ${marquees}</span>
                    </div>
                </div>

                <!-- Main Content -->
                <div class="flex-1 w-full flex items-center justify-center p-4 relative z-10 overflow-y-auto">
                    <!-- Login Box (Responsive) -->
                    <div class="w-full max-w-[900px] min-h-[500px] h-auto md:h-[550px] bg-brand-bg border-2 border-brand-dark shadow-neo flex flex-col md:flex-row relative rounded-2xl overflow-hidden mt-4 md:mt-0">
                        
                        <!-- Left Panel: Announcements -->
                        <div class="w-full md:w-1/2 flex flex-col border-b-2 md:border-b-0 md:border-r-2 border-brand-dark bg-white/60">
                            <div class="p-6 border-b-2 border-brand-dark bg-white shrink-0 text-center">
                                <h2 class="text-xl md:text-2xl font-black uppercase tracking-tight text-brand-dark">BẢNG THÔNG TIN</h2>
                            </div>
                            <div class="flex-1 p-6 overflow-y-auto custom-scrollbar space-y-4">
                                ${STATE.loginAnnouncements.length === 0 ? '<p class="text-center font-bold text-gray-400 text-sm mt-10">Chưa có thông báo mới</p>' : 
                                  STATE.loginAnnouncements.map(a => `
                                    <div onclick="viewLoginAnnouncement('${a.id}')" class="bg-white border-2 border-brand-dark p-4 rounded-xl shadow-sm hover:shadow-neo-sm hover:-translate-y-1 transition-all cursor-pointer group">
                                        <div class="flex justify-between items-center mb-2">
                                            <span class="px-2 py-0.5 text-[9px] font-black uppercase border border-brand-dark rounded bg-brand-light text-brand-dark">THÔNG BÁO</span>
                                        </div>
                                        <h4 class="text-sm font-black uppercase leading-snug group-hover:text-brand-primary transition-colors line-clamp-2">${a.title}</h4>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <!-- Right Panel: Login -->
                        <div class="w-full md:w-1/2 flex flex-col justify-center items-center bg-white p-6 md:p-10 relative">
                            <!-- Main Logo replacing Sub Logo inside the box -->
                            <img src="${BRAND.logoMain}" alt="Main Logo" class="h-[80px] md:h-[100px] w-auto object-contain mb-6 filter drop-shadow-md">
                            
                            <h2 class="text-lg md:text-xl font-black uppercase mb-8 text-center tracking-tight text-brand-dark w-full">ĐĂNG NHẬP HỆ THỐNG</h2>
                            
                            <form onsubmit="window.handleLogin(event)" class="w-full max-w-[320px] space-y-5">
                                <div>
                                    <label class="block font-black text-[10px] mb-1 uppercase text-gray-500 tracking-wider">Mã Tài Khoản</label>
                                    <input type="text" id="login_user" class="w-full neo-input rounded-xl px-4 py-3 text-sm font-bold bg-gray-50" placeholder="Mã GV / Admin" required>
                                </div>
                                <div>
                                    <label class="block font-black text-[10px] mb-1 uppercase text-gray-500 tracking-wider">Mật Khẩu</label>
                                    <input type="password" id="login_pass" class="w-full neo-input rounded-xl px-4 py-3 text-sm font-bold bg-gray-50" placeholder="••••••••" required>
                                </div>
                                <button type="submit" class="w-full mt-2 bg-brand-dark text-white font-black text-sm uppercase py-4 rounded-xl neo-btn">BẮT ĐẦU PHIÊN LÀM VIỆC</button>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Clock Badge -->
                <div class="absolute bottom-4 right-4 bg-white/90 backdrop-blur px-4 py-2 border-2 border-brand-dark rounded-xl shadow-neo-sm font-black text-[10px] sm:text-xs text-brand-dark z-50 flex items-center" id="verticalClock"></div>
            </div>`;
        };

        const renderWorkspace = () => {
            const isAdmin = STATE.user.role === 'ADMIN';
            
            const MENUS = isAdmin ? [
                { id: 'DASHBOARD', icon: 'fa-chart-pie', text: 'Tổng Quan' },
                { id: 'USERS', icon: 'fa-users', text: 'Nhân Sự' },
                { id: 'CALENDAR', icon: 'fa-calendar-days', text: 'Lịch & Phân Công' },
                { id: 'TASKS', icon: 'fa-list-check', text: 'Công Việc' },
                { id: 'ATTENDANCE', icon: 'fa-qrcode', text: 'Chấm Công & QR' },
                { id: 'DOCS', icon: 'fa-folder-open', text: 'Tài Liệu' },
                { id: 'REQUESTS', icon: 'fa-envelope-open-text', text: 'Duyệt Yêu Cầu' },
                { id: 'ANNOUNCEMENTS', icon: 'fa-bullhorn', text: 'Bảng Tin' }
            ] : [
                { id: 'DASHBOARD', icon: 'fa-house', text: 'Tổng Quan' },
                { id: 'CALENDAR', icon: 'fa-calendar-days', text: 'Lịch Của Tôi' },
                { id: 'TASKS', icon: 'fa-list-check', text: 'Công Việc' },
                { id: 'ATTENDANCE', icon: 'fa-qrcode', text: 'Chấm Công' },
                { id: 'DOCS', icon: 'fa-folder-open', text: 'Tài Liệu' },
                { id: 'REQUESTS', icon: 'fa-paper-plane', text: 'Yêu Cầu' }
            ];

            return `
            <div class="flex flex-col h-screen w-full overflow-hidden bg-emerald-50">
                <!-- Header -->
                <div class="h-14 md:h-16 bg-white border-b-2 border-brand-dark flex items-center justify-between px-4 md:px-6 shrink-0 z-30 shadow-sm">
                    <div class="flex items-center gap-3">
                        <img src="${BRAND.logoSub}" alt="Logo" class="h-8 md:h-10 object-contain drop-shadow-sm">
                        <div class="hidden sm:block border-l-2 border-brand-dark pl-3">
                            <h1 class="font-black text-xs uppercase leading-tight tracking-wider text-brand-dark">CHEMEASYY EDUCATION</h1>
                            <p class="text-[9px] font-bold text-gray-500 uppercase tracking-widest">Mở trí - Luyện tài - Dựng nhân</p>
                        </div>
                    </div>
                    
                    <div class="hidden lg:block text-center flex-1">
                        <span class="font-black text-sm uppercase tracking-widest bg-brand-light text-brand-primary px-4 py-1.5 rounded-lg border-2 border-brand-dark shadow-neo-sm">HỆ THỐNG QUẢN TRỊ 2026</span>
                    </div>

                    <!-- User Menu -->
                    <div class="relative">

        window.saveUser = async (e, id) => {

                type: 'TEACHER', role: 'STAFF'
            };

                if (id && id !== 'null') {
                    if(STATE.isOnline && STATE.db) await updateDoc(doc(STATE.db, 'artifacts', appId, 'public', 'data', 'users', id), data);

                            ${getCalHeader()}
                        </div>
                        <button onclick="window.changeCalDate(1)" class="w-8 h-8 shrink-0 bg-white border-2 border-brand-dark rounded-lg flex items-center justify-center hover:bg-gray-100 shadow-neo-sm"><i class="fa-solid fa-chevron-right"></i></button>
                        <button onclick="window.setCalToday()" class="px-3 h-8 shrink-0 bg-brand-dark text-white border-2 border-brand-dark font-black uppercase text-[9px] md:text-[10px] rounded-lg hover:bg-brand-primary shadow-neo-sm ml-1 md:ml-2">Hôm nay</button>
                    </div>
                    
                    <div class="flex items-center gap-2 md:gap-4 w-full md:w-auto justify-between md:justify-end">
                        <!-- View Toggle -->
                        <div class="flex bg-gray-100 p-1 border-2 border-brand-dark rounded-lg">
                            ${['YEAR', 'MONTH', 'WEEK', 'DAY'].map(v => `<button onclick="window.setCalView('${v}')" class="px-2 md:px-3 py-1.5 text-[8px] md:text-[9px] font-black uppercase rounded ${view===v ? 'bg-white border-2 border-brand-dark shadow-sm':'text-gray-500 hover:text-brand-dark'}">${v}</button>`).join('')}
                        </div>
                        ${isAdmin ? `<button onclick="window.openEventModal()" class="h-8 md:h-9 px-3 md:px-4 bg-brand-primary text-white border-2 border-brand-dark font-black uppercase text-[9px] md:text-[10px] flex items-center gap-2 shadow-neo rounded-lg hover:-translate-y-0.5 transition-transform shrink-0"><i class="fa-solid fa-plus"></i> <span class="hidden sm:inline">Tạo Sự Kiện</span></button>` : ''}
                    </div>
                </div>

                <!-- Calendar Grid Area -->
                <div class="flex-1 bg-white border-2 border-brand-dark rounded-2xl flex flex-col overflow-hidden shadow-neo-sm w-full">
                    ${renderCalGrid(isAdmin)}
                </div>
            </div>`;
        };

        const getCalHeader = () => {
            const d = STATE.calDate;
            if (STATE.calView === 'YEAR') return `Năm ${d.getFullYear()}`;
            if (STATE.calView === 'MONTH') return `Tháng ${d.getMonth() + 1} - ${d.getFullYear()}`;
            if (STATE.calView === 'WEEK') {
                const w = getWeekDates(d); return `Tuần ${w[0].getDate()}/${w[0].getMonth()+1} - ${w[6].getDate()}/${w[6].getMonth()+1}`;
            }
            return `Ngày ${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`;
        };

        const getWeekDates = (date) => {
            const d = new Date(date); const day = d.getDay(); const diff = d.getDate() - day + (day === 0 ? -6 : 1);
            d.setDate(diff); const res = []; for (let i = 0; i < 7; i++) { res.push(new Date(d)); d.setDate(d.getDate() + 1); } return res;
        };

        window.setCalView = (v) => { STATE.calView = v; renderApp(); };
        window.setCalToday = () => { STATE.calDate = new Date(); renderApp(); };
        window.changeCalDate = (dir) => {
            const d = new Date(STATE.calDate);
            if(STATE.calView === 'YEAR') d.setFullYear(d.getFullYear() + dir);
            else if(STATE.calView === 'MONTH') d.setMonth(d.getMonth() + dir);
            else if(STATE.calView === 'WEEK') d.setDate(d.getDate() + (dir * 7));
            else d.setDate(d.getDate() + dir);
            STATE.calDate = d; renderApp();
        };

        const renderCalGrid = (isAdmin) => {
            const view = STATE.calView;
            const visibleEvents = STATE.events.filter(e => isAdmin || e.staffId === STATE.user.id || e.staffId === 'ALL');

            if (view === 'DAY') {
                const dayEvts = visibleEvents.filter(e => e.date === formatDate(STATE.calDate)).sort((a,b) => a.start.localeCompare(b.start));
                if(dayEvts.length === 0) return `<div class="flex-1 flex items-center justify-center font-bold text-gray-400 text-sm cursor-pointer hover:bg-gray-50 transition-colors" onclick="if(${isAdmin}) window.openEventModal('${formatDate(STATE.calDate)}')">Nhấn để thêm lịch trình mới.</div>`;
                return `<div class="flex-1 overflow-y-auto p-4 space-y-3 custom-scrollbar">
                    ${dayEvts.map(e => `
                        <div class="p-3 md:p-4 border-2 border-brand-dark rounded-xl bg-${e.type==='MEETING'?'yellow-100':e.type==='TASK'?'blue-100':'brand-light'} shadow-sm flex flex-col sm:flex-row gap-3 md:gap-4 group">
                            <div class="font-black text-lg md:text-xl w-full sm:w-24 sm:border-r-2 border-b-2 sm:border-b-0 border-brand-dark flex sm:flex-col items-center sm:items-end sm:justify-center pr-0 sm:pr-4 pb-2 sm:pb-0 gap-2 sm:gap-0">
                                <span>${e.start}</span><span class="text-xs md:text-sm text-gray-500">${e.end}</span>
                            </div>
                            <div class="flex-1 cursor-pointer" onclick="window.viewEvent('${e.id}')">
                                <div class="text-[9px] md:text-[10px] font-black uppercase mb-1 bg-white inline-block px-2 py-0.5 rounded border border-brand-dark">${EVENT_TYPES[e.type]}</div>
                                <div class="font-black text-base md:text-lg leading-tight">${e.title}</div>
                                <div class="text-[10px] md:text-xs font-bold mt-1 text-gray-600">👤 ${e.staffId === 'ALL' ? 'Tất cả' : (STATE.users.find(u=>u.id===e.staffId)?.name || 'N/A')}</div>
                            </div>
                            ${isAdmin ? `<button onclick="window.deleteEvent('${e.id}')" class="w-full sm:w-10 h-8 sm:h-10 border-2 border-brand-dark rounded-xl bg-white text-brand-accent hover:bg-brand-accent hover:text-white shrink-0 sm:opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center mt-2 sm:mt-0"><i class="fa-solid fa-trash"></i> <span class="ml-2 text-xs sm:hidden font-black">XÓA</span></button>` : ''}
                        </div>
                    `).join('')}
                    ${isAdmin ? `<div onclick="window.openEventModal('${formatDate(STATE.calDate)}')" class="p-4 border-2 border-dashed border-gray-300 rounded-xl text-center text-gray-400 font-bold cursor-pointer hover:bg-gray-50 hover:border-brand-primary hover:text-brand-primary transition-colors text-sm">+ Thêm lịch trình</div>` : ''}
                </div>`;
            }

            if (view === 'MONTH') {
                const year = STATE.calDate.getFullYear(); const month = STATE.calDate.getMonth();
                const firstDay = new Date(year, month, 1).getDay(); const daysInMonth = new Date(year, month + 1, 0).getDate();
                const days = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
                
                let html = `<div class="overflow-x-auto flex-1 flex flex-col hide-scrollbar"><div class="min-w-[600px] flex-1 flex flex-col">`;
                html += `<div class="grid grid-cols-7 border-b-2 border-brand-dark bg-gray-50 shrink-0">`;
                days.forEach(d => html += `<div class="py-2 text-center border-r-2 border-brand-dark last:border-r-0 font-black text-[10px] uppercase text-gray-500">${d}</div>`);
                html += `</div><div class="flex-1 grid grid-cols-7 grid-rows-5 bg-white">`;
                
                let dayCount = 1 - firstDay;
                for (let i = 0; i < 35; i++) {
                    if (dayCount < 1 || dayCount > daysInMonth) {
                        html += `<div class="border-r-2 border-b-2 border-brand-dark bg-gray-100/50"></div>`;
                    } else {
                        const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(dayCount).padStart(2,'0')}`;
                        const isToday = dateStr === formatDate(new Date());
                        const dayEvents = visibleEvents.filter(e => e.date === dateStr);
                        
                        html += `<div onclick="if(event.target===event.currentTarget && ${isAdmin}) window.openEventModal('${dateStr}'); else { STATE.calDate = new Date('${dateStr}'); STATE.calView = 'DAY'; renderApp(); }" class="border-r-2 border-b-2 border-brand-dark p-1 cursor-pointer hover:bg-brand-light transition-colors flex flex-col ${isToday ? 'bg-brand-light/50' : ''}">
                            <div class="text-right mb-1 pointer-events-none"><span class="inline-block w-5 h-5 text-center leading-5 text-[9px] md:text-[10px] font-black ${isToday ? 'bg-brand-dark text-white rounded' : ''}">${dayCount}</span></div>
                            <div class="flex-1 overflow-y-auto hide-scrollbar space-y-1 pointer-events-none">
                                ${dayEvents.slice(0,3).map(e => `<div class="text-[7px] md:text-[8px] font-black bg-${e.type==='MEETING'?'yellow-200':e.type==='TASK'?'blue-200':'green-200'} px-1 truncate rounded border border-brand-dark">${e.start} ${e.title}</div>`).join('')}
                                ${dayEvents.length > 3 ? `<div class="text-[8px] font-black text-gray-500 text-center">+${dayEvents.length - 3}</div>` : ''}
                            </div>
                        </div>`;
                    }
                    dayCount++;
                }
                html += `</div></div></div>`; return html;
            }

            if (view === 'YEAR') {
                const year = STATE.calDate.getFullYear();
                const months = ['Tháng 1', 'Tháng 2', 'Tháng 3', 'Tháng 4', 'Tháng 5', 'Tháng 6', 'Tháng 7', 'Tháng 8', 'Tháng 9', 'Tháng 10', 'Tháng 11', 'Tháng 12'];
                let html = `<div class="flex-1 grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 md:gap-4 p-4 overflow-y-auto bg-gray-50 custom-scrollbar">`;
                months.forEach((m, idx) => {
                    html += `<div onclick="STATE.calDate = new Date(${year}, ${idx}, 1); STATE.calView = 'MONTH'; renderApp();" class="bg-white border-2 border-brand-dark rounded-xl p-4 flex items-center justify-center cursor-pointer hover:bg-brand-light hover:-translate-y-1 transition-all shadow-sm font-black uppercase tracking-widest text-brand-dark text-xs md:text-sm text-center">${m}</div>`;
                });
                html += `</div>`; return html;
            }

            // WEEK View
            const dates = getWeekDates(STATE.calDate);
            const days = ['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'];
            
            let weekHtml = `<div class="overflow-x-auto flex-1 flex flex-col hide-scrollbar"><div class="min-w-[700px] flex-1 flex flex-col">`;
            weekHtml += `<div class="grid grid-cols-7 border-b-2 border-brand-dark bg-gray-50 shrink-0">
                ${dates.map((d, i) => {
                    const isToday = formatDate(d) === formatDate(new Date());
                    return `<div class="py-2 text-center border-r-2 border-brand-dark last:border-r-0 flex flex-col items-center ${isToday ? 'bg-brand-light' : ''}">
                        <span class="font-black text-[9px] md:text-[10px] uppercase text-gray-500">${days[i]}</span>
                        <span class="text-xs md:text-sm font-black w-5 h-5 md:w-6 md:h-6 flex items-center justify-center mt-1 ${isToday ? 'bg-brand-dark text-white rounded-md' : ''}">${d.getDate()}</span>
                    </div>`;
                }).join('')}
            </div>
            <div class="flex-1 grid grid-cols-7 overflow-y-auto custom-scrollbar bg-white">
                ${dates.map(d => {
                    const dateStr = formatDate(d);
                    const dayEvts = visibleEvents.filter(e => e.date === dateStr).sort((a,b) => a.start.localeCompare(b.start));
                    return `<div onclick="if(event.target===event.currentTarget && ${isAdmin}) window.openEventModal('${dateStr}')" class="border-r-2 border-brand-dark last:border-r-0 p-1 md:p-2 min-h-[300px] cursor-pointer hover:bg-gray-50 flex flex-col gap-2">
                        ${dayEvts.map(e => `
                            <div onclick="window.viewEvent('${e.id}')" class="p-1.5 md:p-2 border-2 border-brand-dark rounded bg-${e.type==='MEETING'?'yellow-100':e.type==='TASK'?'blue-100':'brand-light'} cursor-pointer hover:-translate-y-0.5 transition-transform shadow-sm relative group">
                                <div class="text-[8px] md:text-[9px] font-black uppercase mb-1 bg-white inline-block px-1 rounded border border-brand-dark whitespace-nowrap">${e.start} - ${e.end}</div>
                                <div class="text-[9px] md:text-[11px] font-black leading-tight line-clamp-2">${e.title}</div>
                                <div class="text-[8px] md:text-[9px] font-bold mt-1 text-gray-600 truncate">${e.staffId === 'ALL' ? 'Tất cả' : (STATE.users.find(u=>u.id===e.staffId)?.name || 'N/A')}</div>
                                ${isAdmin ? `<button onclick="event.stopPropagation(); window.deleteEvent('${e.id}')" class="absolute top-1 right-1 w-4 h-4 md:w-5 md:h-5 bg-brand-accent text-white rounded flex items-center justify-center opacity-0 group-hover:opacity-100 text-[8px] md:text-[10px] border border-brand-dark"><i class="fa-solid fa-xmark"></i></button>` : ''}
                            </div>
                        `).join('')}
                    </div>`;
                }).join('')}
            </div></div></div>`;
            return weekHtml;
        };

        window.openEventModal = (dateStr = formatDate(new Date())) => {
            const html = `
                <form onsubmit="window.saveEvent(event)" class="space-y-4">
                    <div><label class="block text-[10px] font-black uppercase mb-1.5">Tiêu đề / Tên lớp / Nhiệm vụ</label><input type="text" id="e_title" class="w-full neo-input p-3 rounded-xl text-sm" required></div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div><label class="block text-[10px] font-black uppercase mb-1.5">Ngày</label><input type="date" id="e_date" value="${dateStr}" class="w-full neo-input p-3 rounded-xl text-sm" required></div>
                        <div>
                            <label class="block text-[10px] font-black uppercase mb-1.5">Phân Loại</label>
                            <select id="e_type" class="w-full neo-input p-3 rounded-xl text-sm bg-white">
                                ${Object.entries(EVENT_TYPES).map(([k,v]) => `<option value="${k}">${v}</option>`).join('')}
                            </select>
                        </div>
                        <div><label class="block text-[10px] font-black uppercase mb-1.5">Giờ Bắt Đầu</label><input type="time" id="e_start" class="w-full neo-input p-3 rounded-xl text-sm" required></div>
                        <div><label class="block text-[10px] font-black uppercase mb-1.5">Giờ Kết Thúc</label><input type="time" id="e_end" class="w-full neo-input p-3 rounded-xl text-sm" required></div>
                    </div>
                    <div>
                        <label class="block text-[10px] font-black uppercase mb-1.5">Phân công cho (Giáo viên/Trợ giảng)</label>
                        <select id="e_staff" class="w-full neo-input p-3 rounded-xl text-sm bg-white">
                            <option value="ALL">Tất cả nhân sự (Họp chung/Sự kiện chung)</option>
                            ${STATE.users.filter(u=>u.type!=='ADMIN').map(u => `<option value="${u.id}">${u.name} (${u.username})</option>`).join('')}
                        </select>
                    </div>
                    <div><label class="block text-[10px] font-black uppercase mb-1.5">Hướng dẫn / Nội dung chi tiết</label><textarea id="e_desc" class="w-full neo-input p-3 rounded-xl text-sm h-24" placeholder="Nhập ghi chú, link tài liệu hoặc yêu cầu chuẩn bị..."></textarea></div>
                    <button type="submit" class="w-full bg-brand-dark text-white font-black uppercase py-4 neo-btn rounded-xl shadow-neo mt-4">Lưu Sự Kiện / Lịch</button>
                </form>
            `;
            openModal('Tạo Lịch / Sự Kiện Mới', html);
        };

        window.saveEvent = async (e) => {
            e.preventDefault();
            const data = {
                title: document.getElementById('e_title').value.trim(), date: document.getElementById('e_date').value,
                type: document.getElementById('e_type').value, start: document.getElementById('e_start').value,
                end: document.getElementById('e_end').value, staffId: document.getElementById('e_staff').value,
                desc: document.getElementById('e_desc').value.trim()
            };
            try {
                if(STATE.isOnline && STATE.db) await addDoc(collection(STATE.db, 'artifacts', appId, 'public', 'data', 'events'), data);
                else { STATE.events.push({ id: 'e'+Date.now(), ...data}); localStorage.setItem('chem_events', JSON.stringify(STATE.events)); }
                showToast('Đã lưu lịch thành công'); closeModal(); renderApp();
            } catch(err) { showToast('Lỗi lưu lịch', 'ERROR'); }
        };

        window.viewEvent = (id) => {
            const ev = STATE.events.find(x => x.id === id); if(!ev) return;
            const staffName = ev.staffId === 'ALL' ? 'Toàn bộ nhân sự' : (STATE.users.find(u=>u.id===ev.staffId)?.name || ev.staffId);
            const html = `
                <div class="space-y-4">
                    <div class="bg-brand-light border-2 border-brand-dark p-4 rounded-xl text-center">
                        <span class="px-2 py-1 text-[10px] font-black uppercase bg-white border border-brand-dark rounded mb-2 inline-block">${EVENT_TYPES[ev.type]}</span>
                        <h2 class="text-xl md:text-2xl font-black uppercase text-brand-dark break-words">${ev.title}</h2>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="border-2 border-brand-dark p-3 md:p-4 rounded-xl bg-gray-50"><p class="text-[9px] md:text-[10px] font-black text-gray-500 uppercase mb-1">Ngày</p><p class="font-bold text-sm md:text-lg">${getFormatDisplay(ev.date)}</p></div>
                        <div class="border-2 border-brand-dark p-3 md:p-4 rounded-xl bg-gray-50"><p class="text-[9px] md:text-[10px] font-black text-gray-500 uppercase mb-1">Thời gian</p><p class="font-bold text-sm md:text-lg">${ev.start} - ${ev.end}</p></div>
                    </div>
                    <div class="border-2 border-brand-dark p-4 rounded-xl bg-white"><p class="text-[10px] font-black text-gray-500 uppercase mb-1">Phân công cho</p><p class="font-bold text-sm">${staffName}</p></div>
                    ${ev.desc ? `<div class="border-2 border-brand-dark p-4 rounded-xl bg-yellow-50"><p class="text-[10px] font-black text-gray-500 uppercase mb-1">Nội dung chi tiết</p><p class="text-xs md:text-sm font-medium whitespace-pre-wrap">${ev.desc}</p></div>` : ''}
                </div>
            `;
            openModal('Chi Tiết Lịch', html);
        };

        window.deleteEvent = async (id) => {
            if(confirm('Xóa sự kiện này khỏi lịch?')) {
                try {
                    if(STATE.isOnline && STATE.db) await deleteDoc(doc(STATE.db, 'artifacts', appId, 'public', 'data', 'events', id));
                    else { STATE.events = STATE.events.filter(x => x.id !== id); localStorage.setItem('chem_events', JSON.stringify(STATE.events)); }
                    showToast('Đã xóa sự kiện'); renderApp();
                } catch(e) { showToast('Lỗi xóa', 'ERROR'); }
            }
        };

        const renderTasksModule = (isAdmin) => {
            const visibleTasks = STATE.tasks.filter(t => isAdmin || t.assignee === STATE.user.id);
            const todo = visibleTasks.filter(t => t.status === 'TODO');
            const doing = visibleTasks.filter(t => t.status === 'DOING');
            const done = visibleTasks.filter(t => t.status === 'DONE');
            const pct = visibleTasks.length ? Math.round((done.length/visibleTasks.length)*100) : 0;

            const renderCard = (t) => `
                <div class="bg-white border-2 border-brand-dark p-3 md:p-4 rounded-xl shadow-sm hover:shadow-neo transition-all flex flex-col group mb-3">
                    <div class="flex justify-between items-start mb-2">
                        <h4 class="font-black text-xs md:text-sm uppercase leading-tight pr-4 line-clamp-2">${t.title}</h4>
                        ${isAdmin ? `<button onclick="window.deleteTask('${t.id}')" class="text-brand-accent hover:bg-brand-accent hover:text-white rounded px-1.5 py-0.5 border border-transparent hover:border-brand-dark transition-colors md:opacity-0 group-hover:opacity-100"><i class="fa-solid fa-trash"></i></button>` : ''}
                    </div>
                    <p class="text-[9px] md:text-[10px] font-bold text-gray-500 mb-2"><i class="fa-regular fa-clock mr-1"></i> Hạn: ${getFormatDisplay(t.deadline)}</p>
                    <div class="text-[10px] md:text-xs font-medium text-gray-600 bg-gray-50 p-2 rounded border border-gray-200 line-clamp-3 mb-3" title="${t.desc}">${t.desc}</div>
                    <div class="flex gap-2 mt-auto">
                        ${t.status !== 'TODO' ? `<button onclick="window.updateTask('${t.id}', 'TODO')" class="flex-1 py-1.5 text-[8px] md:text-[9px] font-black uppercase border-2 border-brand-dark rounded hover:bg-gray-100 bg-white">Cần Làm</button>` : ''}
                        ${t.status !== 'DOING' ? `<button onclick="window.updateTask('${t.id}', 'DOING')" class="flex-1 py-1.5 text-[8px] md:text-[9px] font-black uppercase border-2 border-brand-dark rounded bg-brand-primary text-white hover:bg-emerald-600">Đang Làm</button>` : ''}
                        ${t.status !== 'DONE' ? `<button onclick="window.updateTask('${t.id}', 'DONE')" class="flex-1 py-1.5 text-[8px] md:text-[9px] font-black uppercase border-2 border-brand-dark rounded bg-brand-dark text-white hover:bg-gray-800">Hoàn Thành</button>` : ''}
                    </div>
                </div>
            `;

            return `
            <div class="h-full flex flex-col fade-in max-w-6xl mx-auto relative w-full">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 shrink-0 gap-3">
                    <h2 class="text-xl md:text-2xl font-black uppercase tracking-tight text-brand-dark">QUẢN LÝ CÔNG VIỆC</h2>
                    <div class="flex flex-wrap gap-2 md:gap-3 w-full sm:w-auto">
                        <button class="flex-1 sm:flex-none justify-center px-3 md:px-4 py-2 bg-brand-dark text-white border-2 border-brand-dark rounded-xl font-black text-[9px] md:text-[10px] uppercase shadow-neo-sm flex items-center gap-2 whitespace-nowrap"><i class="fa-solid fa-box-archive"></i> Đã Xong (${done.length}) - ${pct}%</button>
                        ${isAdmin ? `<button onclick="window.openTaskModal()" class="flex-1 sm:flex-none justify-center px-3 md:px-4 py-2 bg-brand-primary text-white border-2 border-brand-dark rounded-xl font-black text-[9px] md:text-[10px] uppercase neo-btn flex items-center gap-2 whitespace-nowrap"><i class="fa-solid fa-plus"></i> Giao Việc</button>` : ''}
                    </div>
                </div>

                <div class="flex-1 flex flex-col md:flex-row gap-4 md:gap-6 min-h-0 overflow-y-auto md:overflow-hidden">
                    <div class="flex-none md:flex-1 flex flex-col bg-gray-100 border-2 border-brand-dark rounded-2xl p-3 md:p-4 shadow-inner min-h-[300px] md:min-h-0">
                        <h3 class="font-black uppercase text-xs md:text-sm mb-3 md:mb-4 bg-white p-2 rounded-lg border-2 border-brand-dark text-center shadow-sm">CẦN LÀM (${todo.length})</h3>
                        <div class="flex-1 overflow-y-auto custom-scrollbar pr-1 md:pr-2 space-y-3">${todo.map(renderCard).join('')}</div>
                    </div>
                    <div class="flex-none md:flex-1 flex flex-col bg-brand-light border-2 border-brand-dark rounded-2xl p-3 md:p-4 shadow-inner min-h-[300px] md:min-h-0">
                        <h3 class="font-black uppercase text-xs md:text-sm mb-3 md:mb-4 bg-white p-2 rounded-lg border-2 border-brand-dark text-center shadow-sm border-b-4 border-b-brand-primary">ĐANG LÀM (${doing.length})</h3>
                        <div class="flex-1 overflow-y-auto custom-scrollbar pr-1 md:pr-2 space-y-3">${doing.map(renderCard).join('')}</div>
                    </div>
                </div>
            </div>`;
        };

        window.openTaskModal = () => {
            const html = `
                <form onsubmit="window.saveTask(event)" class="space-y-4">

            if(STATE.qrInterval) { clearInterval(STATE.qrInterval); STATE.qrInterval = null; }
            
            const classCode = document.getElementById('qr_class').value || 'ALL';
            const staff = document.getElementById('qr_staff').value;
            const start = document.getElementById('qr_start').value || '00:00';
            const end = document.getElementById('qr_end').value || '23:59';
            
            const updateQR = () => {
                const code = mode === 'MANUAL' ? (document.getElementById('qr_code').value || 'CHEM-' + Math.floor(Math.random()*10000)) : 'CHEM-' + Math.floor(Math.random()*100000);
                const session = { classCode, code, staff, start, end, date: formatDate(new Date()) };
                STATE.qrSession = session;
                
                const container = document.getElementById('qrcode-display');
                container.innerHTML = '';
                new QRCode(container, { text: `CODE:${session.code}|CLASS:${session.classCode}`, width: container.clientWidth > 0 ? container.clientWidth : 160, height: container.clientHeight > 0 ? container.clientHeight : 160, colorDark: "#0f172a", colorLight: "#ffffff" });
                document.getElementById('qr-text-display').innerText = session.code;
            };

            updateQR();
            if(mode === 'AUTO') { STATE.qrInterval = setInterval(updateQR, 15000); showToast('Đã bật tạo mã tự động 15s'); }
            else showToast('Đã tạo mã cố định');
            
            renderApp();
            
            // Re-render QR after DOM update
            setTimeout(() => { if(STATE.qrSession) { const c = document.getElementById('qrcode-display'); c.innerHTML=''; new QRCode(c, { text: `CODE:${STATE.qrSession.code}|CLASS:${STATE.qrSession.classCode}`, width: c.clientWidth, height: c.clientHeight, colorDark: "#0f172a", colorLight: "#ffffff" }); } }, 50);

Trân trọng,
${STATE.user.name}`;

        window.saveReq = async(e) => { e.preventDefault(); const d = new Date(); const dateStr = `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()} ${d.getHours()}:${d.getMinutes()}`; const data = {type: document.getElementById('r_type').value, reason: document.getElementById('r_reason').value, datetime: document.getElementById('r_datetime').value, staffId: STATE.user.id, staffName: STATE.user.name, status: 'PENDING', date: dateStr}; try{ if(STATE.isOnline && STATE.db) await addDoc(collection(STATE.db, 'artifacts', appId, 'public', 'data', 'requests'), data); else{STATE.requests.push({id:'r'+Date.now(),...data}); localStorage.setItem('chem_reqs', JSON.stringify(STATE.requests));} showToast('Đã gửi yêu cầu thành công'); closeModal(); renderApp(); }catch(e){} };
        window.updateReq = async(id, status) => { try{ if(STATE.isOnline && STATE.db) await updateDoc(doc(STATE.db, 'artifacts', appId, 'public', 'data', 'requests', id), {status}); else {const idx=STATE.requests.findIndex(x=>x.id===id); if(idx!==-1) STATE.requests[idx].status=status; localStorage.setItem('chem_reqs', JSON.stringify(STATE.requests));} renderApp(); }catch(e){} };
        window.deleteReq = async(id) => { if(confirm('Hủy/Xóa yêu cầu này?')) { try{ if(STATE.isOnline && STATE.db) await deleteDoc(doc(STATE.db, 'artifacts', appId, 'public', 'data', 'requests', id)); else {STATE.requests = STATE.requests.filter(x=>x.id!==id); localStorage.setItem('chem_reqs', JSON.stringify(STATE.requests));} renderApp(); }catch(e){} }};

        const renderDocsModule = (isAdmin) => `
            <div class="max-w-5xl mx-auto h-full flex flex-col fade-in w-full">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 sm:mb-6 shrink-0 border-b-2 border-brand-dark pb-3 gap-3">
                    <h2 class="text-xl md:text-2xl font-black uppercase text-brand-dark tracking-tight">TÀI LIỆU CHUYÊN MÔN</h2>
                    ${isAdmin ? `<button onclick="window.openDocModal()" class="w-full sm:w-auto px-4 py-2 bg-brand-dark text-white rounded-xl border-2 border-brand-dark font-black text-[10px] md:text-xs uppercase neo-btn flex justify-center"><i class="fa-solid fa-upload mr-1"></i> Đăng Link Tài Liệu</button>` : ''}
                </div>
                <div class="flex-1 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 overflow-y-auto custom-scrollbar content-start pb-4">
                    ${STATE.documents.length === 0 ? '<div class="col-span-full text-center p-10 font-bold text-gray-400 bg-gray-50 border-2 border-dashed border-gray-300 rounded-2xl">Chưa có tài liệu nào</div>' : ''}
                    ${STATE.documents.map(d => `
                        <div class="bg-white border-2 border-brand-dark p-4 md:p-5 rounded-2xl shadow-sm hover:shadow-neo transition-all flex flex-col group h-[160px] md:h-[180px]">
                            <div class="w-8 h-8 md:w-10 md:h-10 rounded bg-gray-100 border border-brand-dark flex items-center justify-center mb-2 md:mb-3 text-brand-primary shrink-0"><i class="fa-solid fa-file-pdf text-base md:text-lg"></i></div>
                            <h4 class="font-black text-xs md:text-sm uppercase leading-tight mb-1 truncate text-brand-dark" title="${d.title}">${d.title}</h4>
                            <p class="text-[9px] md:text-[10px] font-bold text-gray-500 mb-2 md:mb-4 line-clamp-2">${d.desc || '---'}</p>
                            <div class="mt-auto flex gap-2 pt-2 border-t border-gray-100">
                                <a href="${d.url}" target="_blank" class="flex-1 text-center py-1.5 md:py-2 bg-brand-light border-2 border-brand-dark rounded-lg font-black text-[9px] md:text-[10px] uppercase text-brand-dark hover:bg-brand-primary hover:text-white transition-colors">TẢI / XEM</a>
                                ${isAdmin ? `<button onclick="window.deleteDocItem('${d.id}')" class="w-8 md:w-9 border-2 border-brand-dark rounded-lg bg-white text-brand-accent hover:bg-brand-accent hover:text-white flex items-center justify-center transition-colors"><i class="fa-solid fa-trash text-xs"></i></button>` : ''}
                            </div>
                        </div>
                    `).join('')}
                </div>
            </div>`;
        window.openDocModal = () => openModal('Thêm Link Tài Liệu', `<form onsubmit="window.saveDocItem(event)" class="space-y-4"><div><label class="block text-[10px] font-black uppercase mb-1">Tên Tài Liệu</label><input type="text" id="d_title" class="w-full neo-input p-3 rounded-xl text-sm" required></div><div><label class="block text-[10px] font-black uppercase mb-1">Đường dẫn URL (Google Drive, Dropbox...)</label><input type="url" id="d_url" class="w-full neo-input p-3 rounded-xl text-sm" required></div><div><label class="block text-[10px] font-black uppercase mb-1">Mô tả ngắn</label><textarea id="d_desc" class="w-full neo-input p-3 rounded-xl text-sm h-20"></textarea></div><button type="submit" class="w-full bg-brand-dark text-white font-black uppercase py-4 neo-btn rounded-xl mt-2">Đăng Tài Liệu</button></form>`);
        window.saveDocItem = async(e) => { e.preventDefault(); const data = {title: document.getElementById('d_title').value, url: document.getElementById('d_url').value, desc: document.getElementById('d_desc').value}; try { if(STATE.isOnline && STATE.db) await addDoc(collection(STATE.db, 'artifacts', appId, 'public', 'data', 'documents'), data); else { STATE.documents.push({id:'d'+Date.now(), ...data}); localStorage.setItem('chem_docs', JSON.stringify(STATE.documents));} showToast('Đã thêm tài liệu'); closeModal(); renderApp(); }catch(e){} };
        window.deleteDocItem = async(id) => { if(confirm('Xóa tài liệu này?')) { try{ if(STATE.isOnline && STATE.db) await deleteDoc(doc(STATE.db, 'artifacts', appId, 'public', 'data', 'documents', id)); else {STATE.documents=STATE.documents.filter(x=>x.id!==id); localStorage.setItem('chem_docs', JSON.stringify(STATE.documents));} renderApp(); }catch(e){} } };

        const renderAnnouncementsModule = () => `
            <div class="max-w-4xl mx-auto h-full flex flex-col fade-in w-full">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 sm:mb-6 shrink-0 border-b-2 border-brand-dark pb-3 gap-3">
                    <h2 class="text-xl md:text-2xl font-black uppercase text-brand-dark tracking-tight">BẢNG TIN SYSTEM</h2>
                    <button onclick="window.openAnnModal()" class="w-full sm:w-auto px-4 py-2 bg-brand-primary text-white rounded-xl border-2 border-brand-dark font-black text-[10px] md:text-xs uppercase neo-btn flex justify-center"><i class="fa-solid fa-plus mr-1"></i> Viết Tin Mới</button>
                </div>
                <div class="flex-1 overflow-y-auto custom-scrollbar space-y-3 md:space-y-4 pr-1">
                    ${[...STATE.loginAnnouncements, ...STATE.marqueeAnnouncements].length === 0 ? '<p class="text-center font-bold text-gray-400 mt-10 bg-gray-50 border-2 border-dashed border-gray-300 p-6 rounded-xl">Chưa có thông báo nào được phát hành</p>' : ''}
                    ${[...STATE.loginAnnouncements, ...STATE.marqueeAnnouncements].map(a => `
                        <div class="bg-white border-2 border-brand-dark p-4 md:p-5 rounded-2xl flex flex-col sm:flex-row justify-between items-start group shadow-sm gap-3">
                            <div class="pr-0 sm:pr-6 w-full">
                                <div class="flex items-center gap-2 mb-2">
                                    <span class="px-2 py-0.5 text-[8px] md:text-[9px] font-black uppercase border border-brand-dark rounded ${a.type==='MARQUEE'?'bg-brand-yellow text-brand-dark':'bg-brand-light text-brand-dark'}">${a.type==='MARQUEE'?'Thanh Chạy Topbar':'Bảng Tin Đăng Nhập'}</span>
                                    <span class="text-[9px] md:text-[10px] font-bold text-gray-500 border border-gray-200 bg-gray-50 px-2 py-0.5 rounded">${getFormatDisplay(a.date)}</span>
                                </div>
                                <h4 class="font-black text-sm md:text-base uppercase text-brand-dark">${a.title}</h4>
                                ${a.content ? `<p class="text-[10px] md:text-xs font-medium text-gray-600 mt-2 bg-gray-50 p-2 rounded border border-gray-100 line-clamp-3">${a.content}</p>` : ''}
                            </div>
                            <button onclick="window.deleteAnn('${a.id}', '${a.type}')" class="w-full sm:w-9 h-8 sm:h-9 border-2 border-brand-dark rounded-lg bg-white text-brand-accent flex items-center justify-center hover:bg-brand-accent hover:text-white shrink-0 transition-colors sm:opacity-0 group-hover:opacity-100"><i class="fa-solid fa-trash text-sm"></i> <span class="ml-2 font-black text-xs sm:hidden">XÓA BẢN TIN</span></button>
                        </div>
                    `).join('')}
                </div>
            </div>`;
        window.openAnnModal = () => openModal('Phát Hành Thông Báo Public', `<form onsubmit="window.saveAnn(event)" class="space-y-4"><div><label class="block text-[10px] font-black uppercase mb-1">Vị Trí Hiển Thị</label><select id="a_type" class="w-full neo-input p-3 rounded-xl bg-white text-sm font-bold"><option value="LOGIN">Bảng thông tin trang Đăng Nhập (Cố định khối lớn)</option><option value="MARQUEE">Thanh Topbar (Dòng chữ chạy ngang phía trên cùng)</option></select></div><div><label class="block text-[10px] font-black uppercase mb-1">Tiêu đề (Hiển thị chính)</label><input type="text" id="a_title" class="w-full neo-input p-3 rounded-xl text-sm" required></div><div><label class="block text-[10px] font-black uppercase mb-1">Nội dung chi tiết (Chỉ dành cho Bảng tin Đăng Nhập)</label><textarea id="a_content" class="w-full neo-input p-3 rounded-xl h-24 text-sm" placeholder="Nhập nội dung đầy đủ của thông báo..."></textarea></div><button type="submit" class="w-full bg-brand-dark text-white font-black uppercase py-4 neo-btn rounded-xl shadow-neo mt-2">Phát Hành Ngay</button></form>`);
        window.saveAnn = async(e) => { e.preventDefault(); const data = {type: document.getElementById('a_type').value, title: document.getElementById('a_title').value.trim(), content: document.getElementById('a_content').value.trim(), date: formatDate(new Date())}; try{ if(STATE.isOnline && STATE.db) await addDoc(collection(STATE.db, 'artifacts', appId, 'public', 'data', 'announcements'), data); else { const all = JSON.parse(localStorage.getItem('chem_anns'))||[]; all.push({id:'a'+Date.now(),...data}); localStorage.setItem('chem_anns', JSON.stringify(all)); STATE[data.type==='LOGIN'?'loginAnnouncements':'marqueeAnnouncements'].push({id:'a'+Date.now(),...data}); } showToast('Đăng thông báo thành công'); closeModal(); renderApp(); }catch(e){} };
        window.deleteAnn = async(id, type) => { if(confirm('Xóa thông báo này vĩnh viễn?')) { try{ if(STATE.isOnline && STATE.db) await deleteDoc(doc(STATE.db, 'artifacts', appId, 'public', 'data', 'announcements', id)); else { let all = JSON.parse(localStorage.getItem('chem_anns'))||[]; all = all.filter(x=>x.id!==id); localStorage.setItem('chem_anns', JSON.stringify(all)); STATE[type==='LOGIN'?'loginAnnouncements':'marqueeAnnouncements'] = STATE[type==='LOGIN'?'loginAnnouncements':'marqueeAnnouncements'].filter(x=>x.id!==id); } showToast('Đã xóa thông báo'); renderApp(); }catch(e){} } };

        window.onload = () => { initFirebase(); };
    </script>
</body>
</html>
