<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChemEasyy Education - Hệ Thống Quản Trị 2026</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        brand: { bg: '#ecfdf5', dark: '#0f172a', primary: '#10b981', light: '#d1fae5', accent: '#ec4899', yellow: '#fde047' }
                    },
                    boxShadow: {
                        'neo': '4px 4px 0px 0px rgba(15, 23, 42, 1)',
                        'neo-sm': '2px 2px 0px 0px rgba(15, 23, 42, 1)',
                    }
                }
            }
        }
    </script>

    <style>
        /* Security & Base Styles */
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #ecfdf5; color: #0f172a; margin: 0; overflow: hidden; user-select: none; /* Block selection */ }
        
        /* Neo-brutalism Utilities */
        .glass-panel { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 2px solid #0f172a; border-radius: 1.5rem; }
        .neo-btn { border: 2px solid #0f172a; font-weight: 800; transition: all 0.1s ease; cursor: pointer; text-transform: uppercase; }
        .neo-btn:hover { transform: translate(-2px, -2px); box-shadow: 4px 4px 0px 0px rgba(15, 23, 42, 1); }
        .neo-btn:active { transform: translate(0, 0); box-shadow: 0px 0px 0px 0px rgba(15, 23, 42, 1); }
        .neo-input { border: 2px solid #0f172a; background: #fff; transition: all 0.2s; outline: none; font-weight: 600; }
        .neo-input:focus { box-shadow: 4px 4px 0px 0px rgba(16, 185, 129, 0.5); border-color: #10b981; }

        /* Marquee */
        .marquee-container { overflow: hidden; white-space: nowrap; background: #d1fae5; border-bottom: 2px solid #0f172a; }
        .marquee-content { display: inline-block; animation: marquee 20s linear infinite; }
        @keyframes marquee { 0% { transform: translateX(100vw); } 100% { transform: translateX(-100%); } }

        /* Scrollbars */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #0f172a; border-radius: 10px; }
        .custom-scrollbar { overflow-y: auto; overflow-x: hidden; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; overflow-x: auto; }

        /* Modals & Toasts */
        #modal-container { position: fixed; inset: 0; z-index: 1000; display: none; background: rgba(15,23,42,0.7); backdrop-filter: blur(4px); align-items: center; justify-content: center; padding: 1rem; }
        .modal-content { background: white; border: 2px solid #0f172a; border-radius: 1.5rem; box-shadow: 8px 8px 0px 0px rgba(15,23,42,1); width: 100%; max-width: 800px; max-height: 90vh; display: flex; flex-direction: column; animation: slideUp 0.3s ease-out; }
        #toast-container { position: fixed; bottom: 20px; left: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .toast-item { pointer-events: auto; background: white; border: 2px solid #0f172a; padding: 1rem 1.5rem; border-radius: 0.75rem; box-shadow: 4px 4px 0px 0px rgba(15,23,42,1); font-weight: 800; text-transform: uppercase; font-size: 0.75rem; animation: slideInLeft 0.3s ease-out forwards; display: flex; align-items: center; gap: 0.75rem; }
        
        /* Animations */
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideInLeft { from { transform: translateX(-100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        /* Utilities */
        input:disabled, select:disabled, textarea:disabled { background-color: #f1f5f9; cursor: not-allowed; opacity: 0.7; }
    </style>
</head>
<body>
    <!-- Root Container -->
    <div id="app" class="w-screen h-screen flex flex-col relative overflow-hidden bg-brand-bg"></div>
    
    <!-- Global Overlays -->
    <div id="modal-container"></div>
    <div id="toast-container"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDocs, onSnapshot, query, addDoc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Security: Block F5 and Ctrl+R
        document.addEventListener('keydown', function(e) {
            if (e.key === 'F5' || (e.ctrlKey && e.key === 'r')) {
                e.preventDefault();
                showToast("Tính năng tải lại trang đã bị khóa để bảo vệ phiên làm việc.", "WARNING");
            }
        });
        document.addEventListener('contextmenu', event => event.preventDefault());

        const firebaseConfig = {
            apiKey: "AIzaSyCbNC7RSwD_hhacqVYQkYSVX-RCdIwNSnc",
            authDomain: "he-thong-thi-2026-cee.firebaseapp.com",
            projectId: "he-thong-thi-2026-cee",
            storageBucket: "he-thong-thi-2026-cee.firebasestorage.app",
            messagingSenderId: "323776019052",
            appId: "1:323776019052:web:74b07dea05a5f0e7493649",
            measurementId: "G-1V75EG9499"
        };
        
        const BRAND = {
            logoMain: "https://i.postimg.cc/wMs3Wv7Q/8-removebg-preview.png",
            adminEmail: "chemeasyyeducation@gmail.com"
        };

        const EVENT_TYPES = { 'TEACHING': 'Lịch Dạy', 'MEETING': 'Họp', 'TASK': 'Làm Việc', 'OTHER': 'Khác' };

        // Global State
        window.STATE = {
            isOnline: true,
            user: null, 
            view: 'LOGIN', 
            activeTab: 'DASHBOARD',
            users: [],
            events: [],
            tasks: [],
            loginAnnouncements: [],
            marqueeAnnouncements: [],
            documents: [],
            requests: [],
            showDropdown: false,
            calView: 'WEEK',
            calDate: new Date(),
            dashboardPeriod: 'DAY',
            unsubs: [],
            db: null,
            auth: null,
            qrTimer: null
        };

        // UI Helpers
        window.showToast = (msg, type = 'SUCCESS') => {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const icon = type === 'ERROR' ? '<i class="fa-solid fa-triangle-exclamation text-brand-accent text-xl"></i>' : 
                         type === 'WARNING' ? '<i class="fa-solid fa-circle-exclamation text-brand-yellow text-xl"></i>' :
                         '<i class="fa-solid fa-circle-check text-brand-primary text-xl"></i>';
            toast.className = `toast-item`;
            toast.innerHTML = `${icon} <span class="flex-1">${msg}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.style.animation = 'slideInLeft 0.3s ease-in reverse forwards'; setTimeout(()=>toast.remove(), 300); }, 4000);
        };

        window.openModal = (title, htmlContent) => {
            const container = document.getElementById('modal-container');
            container.innerHTML = `
                <div class="modal-content relative flex flex-col h-full max-h-[90vh]">
                    <div class="flex justify-between items-center p-5 border-b-2 border-brand-dark bg-gray-50 rounded-t-[1.3rem] shrink-0">
                        <h3 class="font-black text-lg uppercase tracking-tight">${title}</h3>
                        <button onclick="closeModal()" class="w-8 h-8 flex items-center justify-center neo-btn rounded-lg bg-white text-brand-dark hover:bg-brand-accent hover:text-white hover:border-brand-accent"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                    <div class="p-6 overflow-y-auto flex-1 custom-scrollbar bg-white rounded-b-[1.3rem]">
                        ${htmlContent}
                    </div>
                </div>`;
            container.style.display = 'flex';
        };
        window.closeModal = () => { document.getElementById('modal-container').style.display = 'none'; };

        const formatDate = (d) => { const year = d.getFullYear(); const month = String(d.getMonth() + 1).padStart(2, '0'); const day = String(d.getDate()).padStart(2, '0'); return `${year}-${month}-${day}`; };
        const getFormatDisplay = (dStr) => { if(!dStr) return ''; const p = dStr.split('-'); return `${p[2]}/${p[1]}/${p[0]}`; };

        // MOCK ADMIN (Fallback / Initial Setup)
        const MOCK_ADMIN = { id: 'admin1', username: 'CE22122007', password: 'Huuhuy2212@', role: 'ADMIN', name: 'Nguyễn Hữu Huy', type: 'ADMIN', status: 'ACTIVE', phone: '0900000000', email: 'admin@chemeasyy.edu.vn' };
        
        const initFirebase = async () => {
            try {
                const app = initializeApp(firebaseConfig);
                STATE.db = getFirestore(app);
                STATE.auth = getAuth(app);
                
                // Keep session alive
                await setPersistence(STATE.auth, browserLocalPersistence);
                
                onAuthStateChanged(STATE.auth, async (user) => {
                    if (user) {
                        setupRealtime();
                        // Restore user session if refreshed
                        const savedUser = JSON.parse(localStorage.getItem('chem_currentUser'));
                        if(savedUser) {
                            STATE.user = savedUser;
                            STATE.view = 'APP';
                            renderApp();
                        } else {
                            renderApp();
                        }
                    } else {
                        await signInAnonymously(STATE.auth);
                    }
                });
            } catch (error) {
                console.error("Firebase Init Error:", error);
                STATE.isOnline = false;
                loadOfflineData();
                renderApp();
            }
        };

        const setupRealtime = () => {
            STATE.unsubs.forEach(u => u()); STATE.unsubs = [];
            const col = (name) => collection(STATE.db, name);
            
            const handleErr = (e) => { 
                console.warn("Firestore Error:", e); 
                if(STATE.isOnline) { STATE.isOnline = false; showToast("Mất kết nối CSDL. Chuyển sang Offline.", "WARNING"); loadOfflineData(); renderApp(); } 
            };
            
            try {
                STATE.unsubs.push(onSnapshot(query(col('users')), (snap) => {
                    const dbUsers = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    STATE.users = [MOCK_ADMIN, ...dbUsers.filter(u => u.username !== MOCK_ADMIN.username)];
                    localStorage.setItem('chem_users', JSON.stringify(STATE.users));
                    if(STATE.view !== 'LOGIN' && STATE.activeTab === 'USERS') renderApp();
                }, handleErr));

                STATE.unsubs.push(onSnapshot(query(col('events')), (snap) => { 
                    STATE.events = snap.docs.map(d => ({ id: d.id, ...d.data() })); localStorage.setItem('chem_events', JSON.stringify(STATE.events));
                    if(STATE.activeTab === 'CALENDAR' || STATE.activeTab === 'DASHBOARD') renderApp(); 
                }, handleErr));

                STATE.unsubs.push(onSnapshot(query(col('tasks')), (snap) => { 
                    STATE.tasks = snap.docs.map(d => ({ id: d.id, ...d.data() })); localStorage.setItem('chem_tasks', JSON.stringify(STATE.tasks));
                    if(STATE.activeTab === 'TASKS') renderApp(); 
                }, handleErr));

                STATE.unsubs.push(onSnapshot(query(col('announcements')), (snap) => { 
                    const all = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    STATE.loginAnnouncements = all.filter(a => a.type === 'LOGIN');
                    STATE.marqueeAnnouncements = all.filter(a => a.type === 'MARQUEE');
                    localStorage.setItem('chem_anns', JSON.stringify(all));
                    renderApp(); 
                }, handleErr));

                STATE.unsubs.push(onSnapshot(query(col('documents')), (snap) => { 
                    STATE.documents = snap.docs.map(d => ({ id: d.id, ...d.data() })); localStorage.setItem('chem_docs', JSON.stringify(STATE.documents));
                    if(STATE.activeTab === 'DOCS') renderApp(); 
                }, handleErr));
                
                STATE.unsubs.push(onSnapshot(query(col('requests')), (snap) => { 
                    STATE.requests = snap.docs.map(d => ({ id: d.id, ...d.data() })); localStorage.setItem('chem_reqs', JSON.stringify(STATE.requests));
                    if(STATE.activeTab === 'REQUESTS') renderApp(); 
                }, handleErr));

            } catch(e) { handleErr(e); }
        };

        const loadOfflineData = () => {
            STATE.users = JSON.parse(localStorage.getItem('chem_users')) || [MOCK_ADMIN];
            STATE.events = JSON.parse(localStorage.getItem('chem_events')) || [];
            STATE.tasks = JSON.parse(localStorage.getItem('chem_tasks')) || [];
            const anns = JSON.parse(localStorage.getItem('chem_anns')) || [];
            STATE.loginAnnouncements = anns.filter(a => a.type === 'LOGIN');
            STATE.marqueeAnnouncements = anns.filter(a => a.type === 'MARQUEE');
            STATE.documents = JSON.parse(localStorage.getItem('chem_docs')) || [];
            STATE.requests = JSON.parse(localStorage.getItem('chem_reqs')) || [];
        };

        window.handleLogin = (e) => {
            e.preventDefault();
            const u = document.getElementById('login_user').value.trim();
            const p = document.getElementById('login_pass').value.trim();
            
            const user = STATE.users.find(x => x.username === u && x.password === p);
            if (user) {
                if(user.status && (user.status === 'Tạm nghỉ' || user.status === 'Nghỉ việc')) return showToast('Tài khoản đang bị khóa.', 'ERROR');
                STATE.user = user;
                STATE.view = 'APP';
                STATE.activeTab = 'DASHBOARD';
                localStorage.setItem('chem_currentUser', JSON.stringify(user));
                showToast(`Xin chào, ${user.name}`);
                renderApp();
            } else {
                showToast('Mã nhân sự hoặc mật khẩu không đúng!', 'ERROR');
            }
        };

        window.handleLogout = () => { 
            STATE.user = null; STATE.view = 'LOGIN'; STATE.showDropdown = false; 
            localStorage.removeItem('chem_currentUser');
            showToast('Đã đăng xuất'); renderApp(); 
        };
        
        window.changeTab = (tab) => { STATE.activeTab = tab; STATE.showDropdown = false; renderApp(); };
        window.toggleDropdown = () => { STATE.showDropdown = !STATE.showDropdown; renderApp(); };

        const renderApp = () => {
            const root = document.getElementById('app');
            if (STATE.view === 'LOGIN') {
                root.innerHTML = renderLoginScreen();
                startClock();
            } else {
                stopClock();
                root.innerHTML = renderWorkspace();
                if(STATE.activeTab === 'ATTENDANCE') initQRCode();
            }
        };

        let clockInterval;
        const startClock = () => {
            if(clockInterval) clearInterval(clockInterval);
            const tick = () => {
                const el = document.getElementById('verticalClock');
                if(el) {
                    const d = new Date();
                    el.innerHTML = `<span class="text-3xl">${String(d.getHours()).padStart(2,'0')}</span><span class="text-3xl">:</span><span class="text-3xl">${String(d.getMinutes()).padStart(2,'0')}</span><span class="text-3xl">:</span><span class="text-brand-primary text-3xl">${String(d.getSeconds()).padStart(2,'0')}</span>`;
                }
            };
            tick();
            clockInterval = setInterval(tick, 1000);
        };
        const stopClock = () => clearInterval(clockInterval);

        window.viewLoginAnnouncement = (id) => {
            const ann = STATE.loginAnnouncements.find(a => a.id === id);
            if(ann) openModal(ann.title, `<div class="font-medium text-gray-700 whitespace-pre-wrap leading-relaxed text-sm">${ann.content}</div>`);
        };

        const renderLoginScreen = () => {
            const marquees = STATE.marqueeAnnouncements.length > 0 ? STATE.marqueeAnnouncements.map(a => a.title).join(' • ') : "CHÀO MỪNG ĐẾN VỚI HỆ THỐNG QUẢN TRỊ 2026 - CHEMEASYY EDUCATION";
            
            return `
            <div class="w-full h-full flex flex-col relative">
                <!-- Topbar -->
                <div class="h-12 bg-white border-b-2 border-brand-dark flex items-center shrink-0 z-20">
                    <div class="marquee-container flex-1 h-full flex items-center px-4 bg-brand-light border-none">
                        <span class="marquee-content font-black text-sm uppercase tracking-widest text-brand-primary"><i class="fa-solid fa-bullhorn mr-2"></i> ${marquees}</span>
                    </div>
                </div>

                <!-- Main Content -->
                <div class="flex-1 w-full flex items-center justify-center p-4 relative z-10">
                    <div class="w-full max-w-[950px] h-[550px] bg-brand-bg border-2 border-brand-dark shadow-neo flex flex-col md:flex-row relative rounded-2xl overflow-hidden">
                        
                        <!-- Left Panel: Announcements -->
                        <div class="w-full md:w-1/2 flex flex-col border-b-2 md:border-b-0 md:border-r-2 border-brand-dark bg-white/50">
                            <div class="p-6 border-b-2 border-brand-dark bg-white shrink-0 text-center">
                                <h2 class="text-2xl font-black uppercase tracking-tight text-brand-dark">BẢNG THÔNG TIN</h2>
                            </div>
                            <div class="flex-1 p-6 overflow-y-auto custom-scrollbar space-y-4">
                                ${STATE.loginAnnouncements.length === 0 ? '<p class="text-center font-bold text-gray-400 text-sm mt-10">Chưa có thông báo mới</p>' : 
                                  STATE.loginAnnouncements.map(a => `
                                    <div onclick="viewLoginAnnouncement('${a.id}')" class="bg-white border-2 border-brand-dark p-4 rounded-xl shadow-sm hover:shadow-neo-sm hover:-translate-y-1 transition-all cursor-pointer group">
                                        <div class="flex justify-between items-center mb-2">
                                            <span class="px-2 py-0.5 text-[9px] font-black uppercase border border-brand-dark rounded bg-brand-light text-brand-dark">THÔNG BÁO</span>
                                            <span class="text-[10px] font-bold text-gray-500">${getFormatDisplay(a.date)}</span>
                                        </div>
                                        <h4 class="text-sm font-black uppercase leading-snug group-hover:text-brand-primary transition-colors line-clamp-2">${a.title}</h4>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <!-- Right Panel: Login -->
                        <div class="w-full md:w-1/2 flex flex-col justify-center items-center bg-white p-10 relative">
                            <!-- Large Logo Inside Box -->
                            <img src="${BRAND.logoMain}" alt="Main Logo" class="h-[140px] object-contain mb-8 filter drop-shadow-[0_4px_6px_rgba(0,0,0,0.3)] border-none outline-none bg-transparent">
                            
                            <h2 class="text-xl font-black uppercase mb-8 text-center tracking-tight text-brand-dark w-full">ĐĂNG NHẬP HỆ THỐNG</h2>
                            
                            <form onsubmit="window.handleLogin(event)" class="w-full max-w-[320px] space-y-5">
                                <div>
                                    <label class="block font-black text-[10px] mb-1 uppercase text-gray-500 tracking-wider">Mã Tài Khoản</label>
                                    <input type="text" id="login_user" class="w-full neo-input rounded-xl px-4 py-3 text-sm font-bold bg-gray-50" placeholder="Nhập mã nhân sự" required>
                                </div>
                                <div>
                                    <label class="block font-black text-[10px] mb-1 uppercase text-gray-500 tracking-wider">Mật Khẩu</label>
                                    <input type="password" id="login_pass" class="w-full neo-input rounded-xl px-4 py-3 text-sm font-bold bg-gray-50" placeholder="••••••••" required>
                                </div>
                                <button type="submit" class="w-full mt-2 bg-brand-dark text-white font-black text-sm uppercase py-4 rounded-xl neo-btn">BẮT ĐẦU PHIÊN LÀM VIỆC</button>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Vertical Clock Bottom Right -->
                <div class="absolute bottom-6 right-6 flex flex-col items-center justify-center font-black text-brand-dark z-50 bg-white border-2 border-brand-dark p-3 shadow-neo rounded-xl" id="verticalClock">
                    --:--:--
                </div>
            </div>`;
        };

        const renderWorkspace = () => {
            const isAdmin = STATE.user.role === 'ADMIN';
            
            const MENUS = isAdmin ? [
                { id: 'DASHBOARD', icon: 'fa-chart-pie', text: 'Tổng Quan' },
                { id: 'USERS', icon: 'fa-users', text: 'Nhân Sự' },
                { id: 'CALENDAR', icon: 'fa-calendar-days', text: 'Lịch & Phân Công' },
                { id: 'TASKS', icon: 'fa-list-check', text: 'Công Việc' },
                { id: 'ATTENDANCE', icon: 'fa-qrcode', text: 'Chấm Công & QR' },
                { id: 'DOCS', icon: 'fa-folder-open', text: 'Tài Liệu' },
                { id: 'REQUESTS', icon: 'fa-envelope-open-text', text: 'Duyệt Yêu Cầu' },
                { id: 'ANNOUNCEMENTS', icon: 'fa-bullhorn', text: 'Bảng Tin' }
            ] : [
                { id: 'DASHBOARD', icon: 'fa-house', text: 'Tổng Quan' },
                { id: 'CALENDAR', icon: 'fa-calendar-days', text: 'Lịch Của Tôi' },
                { id: 'TASKS', icon: 'fa-list-check', text: 'Công Việc' },
                { id: 'ATTENDANCE', icon: 'fa-qrcode', text: 'Chấm Công' },
                { id: 'DOCS', icon: 'fa-folder-open', text: 'Tài Liệu' },
                { id: 'REQUESTS', icon: 'fa-paper-plane', text: 'Gửi Yêu Cầu' }
            ];

            return `
            <div class="flex flex-col h-full w-full">
                <!-- Header -->
                <div class="h-16 bg-white border-b-2 border-brand-dark flex items-center justify-between px-6 shrink-0 z-30 shadow-sm">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 border-2 border-brand-dark rounded-full flex items-center justify-center font-black bg-brand-light text-brand-dark">C</div>
                        <div class="hidden sm:block border-l-2 border-brand-dark pl-3">
                            <h1 class="font-black text-xs uppercase leading-tight tracking-wider text-brand-dark">CHEMEASYY EDUCATION</h1>
                            <p class="text-[9px] font-bold text-gray-500 uppercase tracking-widest">Mở trí - Luyện tài - Dựng nhân</p>
                        </div>
                    </div>
                    
                    <div class="hidden md:block text-center flex-1">
                        <span class="font-black text-sm uppercase tracking-widest bg-brand-light text-brand-primary px-4 py-1.5 rounded-lg border-2 border-brand-dark shadow-neo-sm">HỆ THỐNG QUẢN TRỊ 2026</span>
                    </div>

                    <!-- User Menu -->
                    <div class="relative">
                        <button onclick="window.toggleDropdown()" class="flex items-center gap-3 hover:bg-gray-50 px-3 py-1.5 rounded-xl transition-colors border-2 border-transparent hover:border-brand-dark">
                            <div class="text-right hidden sm:block">
                                <p class="font-black text-xs uppercase text-brand-dark leading-tight">${STATE.user.name}</p>
                                <p class="text-[9px] font-bold text-gray-500 uppercase">${STATE.user.type === 'ADMIN' ? 'Quản Trị Viên' : 'Giáo Viên'} - ${STATE.user.username}</p>
                            </div>
                            <div class="w-8 h-8 bg-brand-dark text-white rounded-full flex items-center justify-center font-black border-2 border-brand-dark">${STATE.user.name.charAt(0)}</div>
                            <i class="fa-solid fa-chevron-down text-[10px] text-gray-600 transition-transform ${STATE.showDropdown ? 'rotate-180' : ''}"></i>
                        </button>

                        ${STATE.showDropdown ? `

                            <div class="w-16 bg-brand-yellow border-2 border-brand-dark relative group rounded-t-lg transition-all" style="height: 70%"><span class="absolute -top-7 left-1/2 -translate-x-1/2 font-black text-xs">12</span><span class="absolute -bottom-8 left-1/2 -translate-x-1/2 font-black text-[10px] text-gray-500">Sắp Tới</span></div>

                        </div>

                </div>`;
            } else {
                return `
                <div class="max-w-4xl mx-auto mt-10 bg-white border-2 border-brand-dark p-8 rounded-3xl shadow-neo flex flex-col md:flex-row items-center gap-8 fade-in">
                    <div class="w-32 h-32 bg-brand-light border-2 border-brand-dark rounded-full flex items-center justify-center shrink-0 shadow-inner">
                        <i class="fa-solid fa-user-tie text-5xl text-brand-primary"></i>

        const renderUsersModule = () => {
            const rows = STATE.users.map(u => `
                <tr class="border-b-2 border-gray-100 hover:bg-gray-50 transition-colors">
                    <td class="p-4 font-black text-xs uppercase whitespace-nowrap">${u.username}</td>

        };

        window.viewProfile = (id) => {
            const u = STATE.users.find(x => x.id === id) || STATE.user;
            const html = `
                <div class="flex gap-6 mb-6 pb-6 border-b-2 border-brand-dark items-center">
                    <img src="${u.avatar || 'https://placehold.co/100x100/10b981/ffffff?text='+u.name.charAt(0)}" class="w-24 h-24 rounded-2xl border-2 border-brand-dark object-cover shadow-neo shrink-0" onerror="this.src='https://placehold.co/100x100/10b981/ffffff?text=${u.name.charAt(0)}'">
                    <div>
                        <h2 class="text-2xl font-black uppercase mb-2">${u.name}</h2>
                        <div class="flex flex-wrap gap-2">
                            <span class="bg-brand-light px-2.5 py-1 text-[10px] font-black uppercase rounded border border-brand-dark text-brand-dark">${u.type === 'TEACHER' ? 'Giáo Viên' : u.type==='ADMIN'?'Admin':'Trợ Giảng'}</span>
                            <span class="bg-gray-100 px-2.5 py-1 text-[10px] font-black uppercase rounded border border-brand-dark text-gray-700">MÃ: ${u.username}</span>
                            <span class="px-2.5 py-1 text-[10px] font-black uppercase rounded border border-brand-dark text-white ${u.status==='Đang làm'?'bg-brand-primary':'bg-gray-500'}">${u.status || 'Đang làm'}</span>
                        </div>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4 text-sm font-bold">
                    <div class="space-y-3">
                        <h4 class="font-black uppercase text-[10px] text-gray-500 border-b border-gray-200 pb-1">Liên Hệ</h4>
                        <p><i class="fa-solid fa-phone w-5 text-gray-400"></i> ${u.phone || '---'}</p>
                        <p><i class="fa-solid fa-envelope w-5 text-gray-400"></i> ${u.email || '---'}</p>
                        <p><i class="fa-solid fa-cake-candles w-5 text-gray-400"></i> ${u.dob || '---'}</p>
                        <p><i class="fa-solid fa-location-dot w-5 text-gray-400"></i> ${u.address || '---'}</p>
                    </div>
                    <div class="space-y-3">
                        <h4 class="font-black uppercase text-[10px] text-gray-500 border-b border-gray-200 pb-1">Chuyên Môn</h4>
                        <p class="text-xs"><span class="text-gray-400">Môn:</span> ${u.subject || '---'}</p>
                        <p class="text-xs"><span class="text-gray-400">Khối:</span> ${u.grade || '---'}</p>
                        <p class="text-xs"><span class="text-gray-400">CT:</span> ${u.program || '---'}</p>
                        <p class="text-xs"><span class="text-gray-400">KN:</span> ${u.exp || '---'}</p>
                        <p class="text-xs"><span class="text-gray-400">Chứng chỉ:</span> ${u.certs || '---'}</p>
                    </div>
                </div>
            `;
            openModal('Hồ Sơ Chi Tiết', html);
        };

        window.openUserModal = (id = null) => {
            const u = id ? STATE.users.find(x => x.id === id) : {};
            const html = `
                <form onsubmit="window.saveUser(event, '${id}')" class="space-y-4">
                    <div class="bg-gray-50 p-4 border-2 border-brand-dark rounded-xl space-y-4">
                        <div class="grid grid-cols-2 gap-4">
                            <div><label class="block text-[10px] font-black uppercase mb-1.5">Mã NV / Username</label><input type="text" id="u_user" value="${u.username||''}" class="w-full neo-input p-2.5 rounded-lg text-sm" required ${id?'readonly bg-gray-200':''}></div>
                            <div><label class="block text-[10px] font-black uppercase mb-1.5">Mật khẩu</label><input type="text" id="u_pass" value="${u.password||''}" class="w-full neo-input p-2.5 rounded-lg text-sm" required></div>
                            <div class="col-span-2"><label class="block text-[10px] font-black uppercase mb-1.5">Họ và Tên</label><input type="text" id="u_name" value="${u.name||''}" class="w-full neo-input p-2.5 rounded-lg text-sm" required></div>
                            <div><label class="block text-[10px] font-black uppercase mb-1.5">Điện thoại</label><input type="text" id="u_phone" value="${u.phone||''}" class="w-full neo-input p-2.5 rounded-lg text-sm"></div>
                            <div><label class="block text-[10px] font-black uppercase mb-1.5">Email</label><input type="email" id="u_email" value="${u.email||''}" class="w-full neo-input p-2.5 rounded-lg text-sm"></div>
                            <div><label class="block text-[10px] font-black uppercase mb-1.5">Ngày sinh</label><input type="date" id="u_dob" value="${u.dob||''}" class="w-full neo-input p-2.5 rounded-lg text-sm"></div>
                            <div>
                                <label class="block text-[10px] font-black uppercase mb-1.5">Trạng thái</label>
                                <select id="u_status" class="w-full neo-input p-2.5 rounded-lg text-sm bg-white">
                                    <option value="Đang làm" ${u.status==='Đang làm'?'selected':''}>Đang làm</option>
                                    <option value="Tạm nghỉ" ${u.status==='Tạm nghỉ'?'selected':''}>Tạm nghỉ</option>
                                    <option value="Nghỉ việc" ${u.status==='Nghỉ việc'?'selected':''}>Nghỉ việc</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="bg-gray-50 p-4 border-2 border-brand-dark rounded-xl">
                        <h4 class="font-black text-xs uppercase mb-3 border-b border-gray-300 pb-1">Thông tin chuyên môn</h4>
                        <div class="grid grid-cols-3 gap-4">
                            <div><label class="block text-[10px] font-black uppercase mb-1.5">Môn</label><input type="text" id="u_subject" value="${u.subject||''}" placeholder="Toán, Lý..." class="w-full neo-input p-2.5 rounded-lg text-sm"></div>
                            <div><label class="block text-[10px] font-black uppercase mb-1.5">Khối</label><input type="text" id="u_grade" value="${u.grade||''}" placeholder="10, 11, 12" class="w-full neo-input p-2.5 rounded-lg text-sm"></div>
                            <div><label class="block text-[10px] font-black uppercase mb-1.5">Chương trình</label><input type="text" id="u_program" value="${u.program||''}" placeholder="THPT, ĐGNL..." class="w-full neo-input p-2.5 rounded-lg text-sm"></div>
                        </div>
                    </div>
                    <button type="submit" class="w-full bg-brand-dark text-white font-black uppercase py-4 neo-btn rounded-xl mt-4">Lưu Hồ Sơ</button>
                </form>
            `;
            openModal(id ? 'Sửa Hồ Sơ Nhân Sự' : 'Thêm Nhân Sự Mới', html);
        };

        window.saveUser = async (e, id) => {
            e.preventDefault();
            const data = {
                username: document.getElementById('u_user').value.trim(), password: document.getElementById('u_pass').value,
                name: document.getElementById('u_name').value.trim(), phone: document.getElementById('u_phone').value,
                email: document.getElementById('u_email').value, dob: document.getElementById('u_dob').value,
                status: document.getElementById('u_status').value, subject: document.getElementById('u_subject').value,
                grade: document.getElementById('u_grade').value, program: document.getElementById('u_program').value,
                type: 'TEACHER', role: 'STAFF'
            };
            try {
                if (id && id !== 'null') {
                    if(STATE.isOnline) await updateDoc(doc(STATE.db, 'users', id), data);
                    else { const idx = STATE.users.findIndex(x => x.id === id); if(idx!==-1) STATE.users[idx] = {...STATE.users[idx], ...data}; }
                    showToast('Cập nhật thành công');
                } else {
                    if(STATE.isOnline) await addDoc(collection(STATE.db, 'users'), data);
                    else STATE.users.push({ id: 'u' + Date.now(), ...data });
                    showToast('Thêm mới thành công');
                }
                if(!STATE.isOnline) localStorage.setItem('chem_users', JSON.stringify(STATE.users));
                closeModal(); renderApp();
            } catch (err) { showToast('Lỗi lưu dữ liệu', 'ERROR'); }
        };

        window.deleteUser = async (id) => {
            if(confirm('Chắc chắn xóa nhân sự này? Thao tác không thể hoàn tác.')) {
                try {
                    if(STATE.isOnline) await deleteDoc(doc(STATE.db, 'users', id));
                    else STATE.users = STATE.users.filter(x => x.id !== id);
                    if(!STATE.isOnline) localStorage.setItem('chem_users', JSON.stringify(STATE.users));
                    showToast('Đã xóa thành công'); renderApp();
                } catch(e) { showToast('Lỗi xóa', 'ERROR'); }
            }
        };

        const renderCalendarModule = (isAdmin) => {
            const view = STATE.calView;
            
            return `
            <div class="h-full flex flex-col fade-in max-w-6xl mx-auto">
                <!-- Toolbar -->
                <div class="flex justify-between items-center border-b-2 border-brand-dark pb-3 mb-4 shrink-0">
                    <div class="flex items-center gap-3">
                        <button onclick="window.changeCalDate(-1)" class="w-8 h-8 bg-white border-2 border-brand-dark rounded-lg flex items-center justify-center hover:bg-gray-100 shadow-neo-sm"><i class="fa-solid fa-chevron-left"></i></button>
                        <div class="px-4 h-8 flex items-center justify-center bg-brand-light border-2 border-brand-dark font-black uppercase shadow-neo-sm text-xs rounded-lg min-w-[150px]">
                            ${getCalHeader()}
                        </div>
                        <button onclick="window.changeCalDate(1)" class="w-8 h-8 bg-white border-2 border-brand-dark rounded-lg flex items-center justify-center hover:bg-gray-100 shadow-neo-sm"><i class="fa-solid fa-chevron-right"></i></button>
                        <button onclick="window.setCalToday()" class="px-3 h-8 bg-brand-dark text-white border-2 border-brand-dark font-black uppercase text-[10px] rounded-lg hover:bg-brand-primary shadow-neo-sm ml-2">Hôm nay</button>
                    </div>
                    
                    <div class="flex items-center gap-4">
                        <!-- View Toggle -->
                        <div class="flex bg-gray-100 p-1 border-2 border-brand-dark rounded-lg">
                            ${['YEAR', 'MONTH', 'WEEK', 'DAY'].map(v => `<button onclick="window.setCalView('${v}')" class="px-3 py-1.5 text-[9px] font-black uppercase rounded ${view===v ? 'bg-white border-2 border-brand-dark shadow-sm':'text-gray-500 hover:text-brand-dark'}">${v}</button>`).join('')}
                        </div>
                        ${isAdmin ? `<button onclick="window.openEventModal()" class="h-9 px-4 bg-brand-primary text-white border-2 border-brand-dark font-black uppercase text-[10px] flex items-center gap-2 shadow-neo rounded-lg hover:-translate-y-0.5 transition-transform"><i class="fa-solid fa-plus"></i> Tạo Sự Kiện</button>` : ''}
                    </div>
                </div>

                <!-- Calendar Grid Area -->
                <div class="flex-1 bg-white border-2 border-brand-dark rounded-2xl flex flex-col overflow-hidden shadow-neo-sm">
                    ${renderCalGrid(isAdmin)}
                </div>
            </div>`;
        };

        const getCalHeader = () => {
            const d = STATE.calDate;
            if (STATE.calView === 'YEAR') return `Năm ${d.getFullYear()}`;
            if (STATE.calView === 'MONTH') return `Tháng ${d.getMonth() + 1} - ${d.getFullYear()}`;
            if (STATE.calView === 'WEEK') {
                const w = getWeekDates(d);
                return `Tuần ${w[0].getDate()}/${w[0].getMonth()+1} - ${w[6].getDate()}/${w[6].getMonth()+1}`;
            }
            return `Ngày ${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`;
        };

        const getWeekDates = (date) => {
            const d = new Date(date); const day = d.getDay(); const diff = d.getDate() - day + (day === 0 ? -6 : 1);
            d.setDate(diff); const res = []; for (let i = 0; i < 7; i++) { res.push(new Date(d)); d.setDate(d.getDate() + 1); } return res;
        };

        window.setCalView = (v) => { STATE.calView = v; renderApp(); };
        window.setCalToday = () => { STATE.calDate = new Date(); renderApp(); };
        window.changeCalDate = (dir) => {
            const d = new Date(STATE.calDate);

                            <p class="text-[10px] font-bold text-gray-500 mb-4 line-clamp-2">${d.desc}</p>
                            <div class="mt-auto flex gap-2">
                                <a href="${d.url}" target="_blank" class="flex-1 text-center py-2 bg-brand-light border-2 border-brand-dark rounded-lg font-black text-[10px] uppercase text-brand-dark hover:bg-brand-primary hover:text-white transition-colors">MỞ LINK</a>
                                ${isAdmin ? `<button onclick="window.deleteDocItem('${d.id}')" class="w-9 border-2 border-brand-dark rounded-lg bg-white text-brand-accent hover:bg-brand-accent hover:text-white flex items-center justify-center"><i class="fa-solid fa-trash"></i></button>` : ''}
                            </div>
                        </div>
                    `).join('')}
                </div>
            </div>`;
        
        window.openDocModal = () => openModal('Thêm Tài Liệu Mới', `<form onsubmit="window.saveDocItem(event)" class="space-y-4"><div><label class="block text-[10px] font-black uppercase mb-1">Tên Tài Liệu</label><input type="text" id="d_title" class="w-full neo-input p-3 rounded-xl" required></div><div><label class="block text-[10px] font-black uppercase mb-1">Đường dẫn URL (Google Drive, Docs...)</label><input type="url" id="d_url" class="w-full neo-input p-3 rounded-xl" required></div><div><label class="block text-[10px] font-black uppercase mb-1">Mô tả ngắn</label><input type="text" id="d_desc" class="w-full neo-input p-3 rounded-xl"></div><button type="submit" class="w-full bg-brand-dark text-white font-black uppercase py-4 neo-btn rounded-xl">Đăng Tài Liệu</button></form>`);
        window.saveDocItem = async(e) => { e.preventDefault(); const data = {title: document.getElementById('d_title').value, url: document.getElementById('d_url').value, desc: document.getElementById('d_desc').value}; try { if(STATE.isOnline) await addDoc(collection(STATE.db, 'documents'), data); else { STATE.documents.push({id:'d'+Date.now(), ...data}); localStorage.setItem('chem_docs', JSON.stringify(STATE.documents));} showToast('Đã thêm'); closeModal(); renderApp(); }catch(e){} };
        window.deleteDocItem = async(id) => { if(confirm('Xóa tài liệu?')) { try{ if(STATE.isOnline) await deleteDoc(doc(STATE.db, 'documents', id)); else {STATE.documents=STATE.documents.filter(x=>x.id!==id); localStorage.setItem('chem_docs', JSON.stringify(STATE.documents));} renderApp(); }catch(e){} } };

        // Requests Module (Duyệt/Gửi Yêu Cầu)
        const renderRequestsModule = (isAdmin) => {
            const reqs = isAdmin ? STATE.requests : STATE.requests.filter(r => r.staffId === STATE.user.id);
            return `
            <div class="max-w-5xl mx-auto h-full flex flex-col fade-in">
                <div class="flex justify-between items-center mb-6 shrink-0 border-b-2 border-brand-dark pb-2">
                    <h2 class="text-2xl font-black uppercase text-brand-dark">${isAdmin ? 'QUẢN LÝ YÊU CẦU' : 'GỬI YÊU CẦU'}</h2>
                    ${!isAdmin ? `<button onclick="window.openReqModal()" class="px-4 py-2 bg-brand-dark text-white rounded-xl border-2 border-brand-dark font-black text-[10px] uppercase neo-btn"><i class="fa-solid fa-paper-plane mr-1"></i> Viết Yêu Cầu</button>` : ''}
                </div>
                <div class="flex-1 overflow-y-auto custom-scrollbar space-y-3">
                    ${reqs.length === 0 ? '<div class="text-center p-10 font-bold text-gray-400">Trống</div>' : ''}
                    ${reqs.map(r => `
                        <div class="bg-white border-2 border-brand-dark p-4 rounded-xl flex items-center justify-between group shadow-sm">
                            <div>
                                <div class="flex items-center gap-2 mb-1">
                                    <span class="px-2 py-0.5 text-[9px] font-black uppercase border border-brand-dark rounded ${r.status==='PENDING'?'bg-brand-yellow text-brand-dark':r.status==='APPROVED'?'bg-brand-primary text-white':'bg-brand-accent text-white'}">${r.status==='PENDING'?'Chờ duyệt':r.status==='APPROVED'?'Đã duyệt':'Từ chối'}</span>
                                    <span class="text-[10px] font-bold text-gray-500">${r.date}</span>
                                </div>
                                <h4 class="font-black text-sm uppercase">${r.type} ${isAdmin ? ` - <span class="text-brand-primary">${r.staffName}</span>` : ''}</h4>
                                <p class="text-xs font-medium text-gray-600 mt-1">${r.content}</p>
                            </div>
                            ${isAdmin && r.status === 'PENDING' ? `
                                <div class="flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                    <button onclick="window.updateReq('${r.id}','APPROVED')" class="px-3 py-1.5 bg-brand-primary text-white border-2 border-brand-dark rounded text-[10px] font-black uppercase hover:bg-emerald-600">Duyệt</button>
                                    <button onclick="window.updateReq('${r.id}','REJECTED')" class="px-3 py-1.5 bg-brand-accent text-white border-2 border-brand-dark rounded text-[10px] font-black uppercase hover:bg-pink-600">Từ Chối</button>
                                </div>
                            ` : ''}
                        </div>
                    `).join('')}
                </div>
            </div>`;
        };
        window.openReqModal = () => openModal('Tạo Yêu Cầu Mới', `<form onsubmit="window.saveReq(event)" class="space-y-4"><div><label class="block text-[10px] font-black uppercase mb-1">Loại Yêu Cầu</label><select id="r_type" class="w-full neo-input p-3 rounded-xl bg-white"><option value="Xin Nghỉ Phép">Xin Nghỉ Phép</option><option value="Đổi Ca Dạy">Đổi Ca Dạy</option><option value="Dạy Thay">Dạy Thay</option></select></div><div><label class="block text-[10px] font-black uppercase mb-1">Nội dung / Lý do</label><textarea id="r_content" class="w-full neo-input p-3 rounded-xl h-24" required></textarea></div><button type="submit" class="w-full bg-brand-dark text-white font-black uppercase py-4 neo-btn rounded-xl">Gửi Yêu Cầu</button></form>`);
        window.saveReq = async(e) => { e.preventDefault(); const data = {type: document.getElementById('r_type').value, content: document.getElementById('r_content').value, staffId: STATE.user.id, staffName: STATE.user.name, status: 'PENDING', date: formatDate(new Date())}; try{ if(STATE.isOnline) await addDoc(collection(STATE.db, 'requests'), data); else{STATE.requests.push({id:'r'+Date.now(),...data}); localStorage.setItem('chem_reqs', JSON.stringify(STATE.requests));} showToast('Đã gửi yêu cầu'); closeModal(); renderApp(); }catch(e){} };
        window.updateReq = async(id, status) => { try{ if(STATE.isOnline) await updateDoc(doc(STATE.db, 'requests', id), {status}); else {const idx=STATE.requests.findIndex(x=>x.id===id); if(idx!==-1) STATE.requests[idx].status=status; localStorage.setItem('chem_reqs', JSON.stringify(STATE.requests));} renderApp(); }catch(e){} };

        // Announcements Module (Bảng Tin)
        const renderAnnouncementsModule = () => `
            <div class="max-w-4xl mx-auto h-full flex flex-col fade-in">
                <div class="flex justify-between items-center mb-6 shrink-0 border-b-2 border-brand-dark pb-2">
                    <h2 class="text-2xl font-black uppercase text-brand-dark">QUẢN LÝ BẢNG TIN PUBLIC</h2>
                    <button onclick="window.openAnnModal()" class="px-4 py-2 bg-brand-primary text-white rounded-xl border-2 border-brand-dark font-black text-[10px] uppercase neo-btn"><i class="fa-solid fa-plus mr-1"></i> Tạo Tin Mới</button>
                </div>
                <div class="flex-1 overflow-y-auto custom-scrollbar space-y-4">
                    ${[...STATE.loginAnnouncements, ...STATE.marqueeAnnouncements].length === 0 ? '<p class="text-center font-bold text-gray-400 mt-10">Chưa có bản tin nào</p>' : ''}
                    ${[...STATE.loginAnnouncements, ...STATE.marqueeAnnouncements].map(a => `
                        <div class="bg-white border-2 border-brand-dark p-5 rounded-2xl flex justify-between items-start group shadow-sm">
                            <div class="pr-6">
                                <div class="flex gap-2 mb-2">
                                    <span class="px-2 py-0.5 text-[9px] font-black uppercase border border-brand-dark rounded ${a.type==='MARQUEE'?'bg-brand-yellow':'bg-brand-light'}">${a.type==='MARQUEE'?'Thanh Topbar (Chạy chữ)':'Trang Đăng Nhập (Cố định)'}</span>
                                    <span class="text-[10px] font-bold text-gray-500">${getFormatDisplay(a.date)}</span>
                                </div>
                                <h4 class="font-black text-sm uppercase">${a.title}</h4>
                                ${a.content ? `<p class="text-xs font-medium text-gray-600 mt-1 line-clamp-2">${a.content}</p>` : ''}
                            </div>
                            <button onclick="window.deleteAnn('${a.id}', '${a.type}')" class="w-8 h-8 border-2 border-brand-dark rounded-lg bg-white text-brand-accent hover:bg-brand-accent hover:text-white shrink-0"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    `).join('')}
                </div>
            </div>`;
        
        window.openAnnModal = () => openModal('Tạo Thông Báo Public', `<form onsubmit="window.saveAnn(event)" class="space-y-4"><div><label class="block text-[10px] font-black uppercase mb-1">Vị Trí Hiển Thị</label><select id="a_type" class="w-full neo-input p-3 rounded-xl bg-white"><option value="LOGIN">Bảng thông tin ở Trang Đăng Nhập (Cố định)</option><option value="MARQUEE">Thanh Topbar (Dòng chữ chạy ngang)</option></select></div><div><label class="block text-[10px] font-black uppercase mb-1">Tiêu đề (Hiển thị chính)</label><input type="text" id="a_title" class="w-full neo-input p-3 rounded-xl" required></div><div><label class="block text-[10px] font-black uppercase mb-1">Nội dung chi tiết (Dành cho trang Đăng nhập)</label><textarea id="a_content" class="w-full neo-input p-3 rounded-xl h-24"></textarea></div><button type="submit" class="w-full bg-brand-dark text-white font-black uppercase py-4 neo-btn rounded-xl">Phát Hành</button></form>`);
        window.saveAnn = async(e) => { e.preventDefault(); const data = {type: document.getElementById('a_type').value, title: document.getElementById('a_title').value, content: document.getElementById('a_content').value, date: formatDate(new Date())}; try{ if(STATE.isOnline) await addDoc(collection(STATE.db, 'announcements'), data); else { const all = JSON.parse(localStorage.getItem('chem_anns'))||[]; all.push({id:'a'+Date.now(),...data}); localStorage.setItem('chem_anns', JSON.stringify(all)); STATE[data.type==='LOGIN'?'loginAnnouncements':'marqueeAnnouncements'].push({id:'a'+Date.now(),...data}); } showToast('Đăng thành công'); closeModal(); renderApp(); }catch(e){} };
        window.deleteAnn = async(id, type) => { if(confirm('Xóa thông báo này?')) { try{ if(STATE.isOnline) await deleteDoc(doc(STATE.db, 'announcements', id)); else { let all = JSON.parse(localStorage.getItem('chem_anns'))||[]; all = all.filter(x=>x.id!==id); localStorage.setItem('chem_anns', JSON.stringify(all)); STATE[type==='LOGIN'?'loginAnnouncements':'marqueeAnnouncements'] = STATE[type==='LOGIN'?'loginAnnouncements':'marqueeAnnouncements'].filter(x=>x.id!==id); } renderApp(); }catch(e){} } };

        // Init
        window.onload = () => { initFirebase(); };
    </script>
</body>
</html>
